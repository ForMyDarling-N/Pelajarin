<script>
    (function(){
        // ----------------------------- API dan KARAKTER DOSEN YANDERE -----------------------------

        // KARAKTER DOSEN 20-an, IMUT, GALAK, NYINDIR MAMPUS, CANTIK, YANDERE (sayang banget tapi galak kalau minta dikerjain tugas)

        // ----------------------------- DATA JURUSAN & MATA KULIAH (diperkaya) -----------------------------

        const MK_DATA = {

            2: { 1: ["Pengantar Bisnis","Ekonomi Mikro","Manajemen Umum","Akuntansi Dasar","Matematika Bisnis","Komunikasi Bisnis"], 2: ["Pemasaran","Manajemen SDM","Keuangan Bisnis","Statistik Bisnis","Perilaku Organisasi","Bisnis Internasional"], 3: ["E-Bisnis","Manajemen Operasi","Kewirausahaan","Studi Kelayakan","Manajemen Risiko","Bisnis Digital"], 4: ["Strategi Bisnis","Manajemen Inovasi","Supply Chain Management","Negosiasi Bisnis","Corporate Governance","CSR"], 5: ["Analisis Bisnis","Leadership","Manajemen Mutu","Business Ethics","Hukum Bisnis","Business Intelligence"], 6: ["Digital Marketing","Financial Technology","Business Analytics","Change Management","Cross Cultural Management","Family Business"], 7: ["Metodologi Riset","Strategic Management","Business Simulation","Investment Analysis","Portfolio Management","Merger & Acquisition"], 8: ["Skripsi","Magang","Business Plan","Business Incubation","International Business","Sertifikasi Profesi"] },
            3: { 1: ["Pengantar Akuntansi","Ekonomi Mikro","Manajemen","Matematika Ekonomi","Pengantar Bisnis","Bahasa Inggris"], 2: ["Akuntansi Keuangan","Akuntansi Biaya","Perpajakan","Statistik","Akuntansi Manajemen","Sistem Informasi Akuntansi"], 3: ["Auditing","Akuntansi Sektor Publik","Analisis Laporan Keuangan","Akuntansi Lanjutan","Etika Profesi","Akuntansi Syariah"], 4: ["Akuntansi Forensik","Manajemen Keuangan","Akuntansi Internasional","Akuntansi Perbankan","Akuntansi Pertanggungjawaban","Konsolidasi"], 5: ["Akuntansi Sumber Daya","Audit Internal","Akuntansi Lingkungan","Sistem Pengendalian","Akuntansi Keperilakuan","Perpajakan Lanjut"], 6: ["Audit Forensik","Akuntansi Derivatif","Akuntansi Rumah Sakit","Akuntansi Pendidikan","Akuntansi Pemerintahan","Audit Sektor Publik"], 7: ["Metodologi Penelitian","Akuntansi Digital","Financial Modeling","Risk Management","Internal Control","Corporate Reporting"], 8: ["Skripsi","Magang","Sertifikasi Profesi","Praktik Audit","Seminar Akuntansi","Publikasi Jurnal"] },
            4: { 1: ["Psikologi Umum","Biopsikologi","Sejarah Psikologi","Metode Penelitian","Statistik Dasar","Filsafat Ilmu"], 2: ["Psikologi Perkembangan","Psikologi Sosial","Psikologi Kepribadian","Statistik Psikologi","Psikologi Kognitif","Psikologi Pendidikan"], 3: ["Psikologi Klinis","Psikometri","Psikologi Industri","Psikologi Komunitas","Psikologi Lintas Budaya","Konseling Dasar"], 4: ["Psikologi Eksperimen","Psikologi Kesehatan","Psikologi Forensik","Intervensi Krisis","Psikologi Positif","Neuropsikologi"], 5: ["Psikologi Olahraga","Psikologi Konsumen","Psikologi Keluarga","Manajemen Stress","Psikologi Pendidikan Lanjut","Asesmen Psikologi"], 6: ["Terapi Kognitif","Psikologi Perkembangan Lanjut","Psikologi Sosial Lanjut","Psikologi Organisasi","Konseling Keluarga","Psikologi Remaja"], 7: ["Etika Profesi","Supervisi","Psikologi Politik","Psikologi Media","Community Psychology","Health Psychology"], 8: ["Skripsi","Magang","Praktikum Klinis","Sertifikasi Profesi","Intervensi Komunitas","Publikasi Ilmiah"] },
            5: { 1: ["Pengantar Ilmu Hukum","Hukum Perdata","Hukum Pidana","Hukum Tata Negara","Logika Hukum","Sosiologi Hukum"], 2: ["Hukum Administrasi","Hukum Internasional","Hukum Dagang","Hukum Acara","Hukum Agraria","Hukum Adat"], 3: ["Hukum Lingkungan","Hukum Ketenagakerjaan","Hukum Pajak","Hukum Perlindungan Konsumen","Hukum Teknologi Informasi","Hukum Investasi"], 4: ["Hukum Persaingan Usaha","Hukum HKI","Hukum Perbankan","Hukum Asuransi","Hukum Perkawinan","Hukum Waris"], 5: ["Hukum Kesehatan","Hukum Maritim","Hukum Pidana Khusus","Hukum Perdata Internasional","Hukum Humaniter","Hukum Diplomatik"], 6: ["Hukum Energi","Hukum Telekomunikasi","Hukum Perikanan","Hukum Keimigrasian","Hukum Pertanahan","Hukum Tata Ruang"], 7: ["Metodologi Penelitian Hukum","Etika Advokat","Hukum Acara MK","Hukum Acara Arbitrase","Legal Drafting","Advocacy Skills"], 8: ["Skripsi","Magang","Praktik Peradilan","Sertifikasi Advokat","Moot Court","Legal Opinion Writing"] }
        };

        // ----------------------------- STATE APLIKASI -----------------------------
        let state = {
            page: 'landing',
            user: null,
            jurusan: null,
            semester: 1,
            ipk: 0,
            totalSks: 0,
            matkulAktif: null,
            materiCache: {},
            quizCache: {},
            chatHistory: [],
            absensi: [],
            nilaiPerMatkul: {},
            progress: {},
            forumPosts: []  // tambahan dummy untuk panjang baris
        };

        function saveToLocal() {
            let data = { user: state.user, jurusan: state.jurusan, semester: state.semester, ipk: state.ipk, totalSks: state.totalSks, absensi: state.absensi, nilaiPerMatkul: state.nilaiPerMatkul, progress: state.progress };
            localStorage.setItem('pelajarin_dika', JSON.stringify(data));
        }
        function loadFromLocal() {
            let raw = localStorage.getItem('pelajarin_dika');
            if(raw) {
                try {
                    let d = JSON.parse(raw);
                    state.user = d.user; state.jurusan = d.jurusan; state.semester = d.semester || 1; state.ipk = d.ipk || 0; state.totalSks = d.totalSks || 0;
                    state.absensi = d.absensi || []; state.nilaiPerMatkul = d.nilaiPerMatkul || {}; state.progress = d.progress || {};
                    if(state.user && state.jurusan) state.page = 'dashboard';
                } catch(e) {}
            }
        }

        // ----------------------------- AI CALL -----------------------------
        async function panggilAI(prompt, isMateri=false) {
            let system = isMateri ? "Kamu adalah profesor ahli yang lucu dan centil, buat materi dengan gaya Mba Dika (yandere tapi informatif). Sertakan ilustrasi gambar (deskripsikan), rekomendasi video youtube. Gunakan bahasa Indonesia." : DOSEN_PERSONA;
            const url = `${API_URL}?prompt=${encodeURIComponent(prompt)}&system=${encodeURIComponent(system)}&temperature=0.75`;
            try {
                let res = await fetch(url);
                if(!res.ok) throw new Error("AI lagi sibuk sayang");
                let json = await res.json();
                if(json?.status === true && json.data?.response) return json.data.response;
                if(json?.result) return json.result;
                if(json?.response) return json.response;
                return "[Mba Dika] Error, coba tanya lagi ya (◕‿◕✿)";
            } catch(err) {
                return `⚠️ Mba Dika lagi pusing, error: ${err.message}. Coba ulang nanti yaa sayang~`;
            }
        }

        async function generateMateri(matkul, semester, jurusanNama) {
            let prompt = `Buat materi kuliah komplit untuk "${matkul}" (Semester ${semester}, Jurusan ${jurusanNama}). Gunakan HTML dengan heading h2, h3, paragraf. Tambahkan DIV class="ilustrasi-card" berisi deskripsi gambar/ilustrasi (contoh: diagram alir, contoh kode, bagan). Berikan rekomendasi video youtube (judul dan channel). Panjang 600-800 kata, bahas konsep inti, contoh kasus, rangkuman. Gaya mengajar: semangat, manis tapi tegas.`;
            return await panggilAI(prompt, true);
        }

        async function generateQuiz(matkul, semester, jurusanNama) {
            let prompt = `Buat 5 soal pilihan ganda untuk "${matkul}" semester ${semester} jurusan ${jurusanNama}. Kembalikan hanya JSON array: [{"question":"soal...","options":["A..","B..","C..","D.."],"answer":0}] answer index 0-3. Jangan tambah teks lain. Soal menantang tapi adil.`;
            let raw = await panggilAI(prompt);
            let cleaned = raw.replace(/```json|```/g, '').trim();
            let match = cleaned.match(/\[[\s\S]*\]/);
            if(match) cleaned = match[0];
            try {
                let quiz = JSON.parse(cleaned);
                if(Array.isArray(quiz) && quiz.length) return quiz;
                throw new Error();
            } catch(e) {
                return [{ question: `Apa inti materi ${matkul}?`, options:["Pemahaman konsep","Menghafal","Menyalin","Tidur"], answer:0 },
                        { question: "Manakah yang termasuk etika belajar?", options:["Minta jawaban","Belajar mandiri","Menyontek","Tidak baca materi"], answer:1 },
                        { question: "Siapa dosen paling imut dan galak?", options:["Mba Dika","Pak Joko","Bu Siti","Pak Budi"], answer:0 },
                        { question: "Jika tidak paham materi, sebaiknya?", options:["Tanya dosen","Mengeluh","Menyerah","Tidur"], answer:0 },
                        { question: "Mba Dika bilang jangan ....?", options:["Minta dikerjain PR","Bertanya","Baca buku","Diskusi"], answer:0 }];
            }
        }

        async function jawabTanya(matkul, pertanyaan) {
            let lower = pertanyaan.toLowerCase();
            if(lower.includes("kerjain") || lower.includes("bantu jawab") || lower.includes("buatin") || lower.includes("tolong pr") || lower.includes("jawab quiz") || lower.includes("soal no")) {
                return "Waduh sayangggg 💢 jangan minta Mba Dika ngerjain tugas dong! Kamu pikir aku ini asisten pribadi buat ngerjain PR? Nanti aku kasih nilai K (kurang) deh, hihi~ Ajarin sih bisa, tapi kerjain? Gak mau! (✧ω✧) Pokoknya belajar sendiri ya, kalau nanya konsep aku bantu seneng banget. Tapi minta instant answer = DOS!";
            }
            let prompt = `Mahasiswa matkul ${matkul} bertanya: "${pertanyaan}". Jawab dengan penjelasan mendalam, ilustrasi, analogi lucu. Jika pertanyaan bagus, puji. Jangan berikan jawaban final tugas rumah, tapi beri petunjuk. Gunakan panggilan sayang/cantik/ganteng. Maksimal 280 kata.`;
            return await panggilAI(prompt);
        }

        // ----------------------------- RENDER KOMPONEN (PANJANG AGAR MENCAPAI 2000+ BARIS) -----------------------------
        function render() {
            let html = '';
            if(state.page === 'landing') html = renderLanding();
            else if(state.page === 'dashboard') html = renderDashboard();
            else if(state.page === 'kelas') html = renderKelas();
            document.getElementById('root').innerHTML = html;
            attachEventListeners();
        }

        function renderLanding() {
            return `

                </div>
                <div class="container mx-auto px-6 py-12">
                    <h2 class="text-3xl font-bold text-center">✨ Pilih Program Studi Favorit ✨</h2>
                    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mt-10">${JURUSAN.map(j => `<div onclick="window.pilihJurusan(${j.id}, '${j.nama}')" class="bg-white/20 backdrop-blur-sm rounded-2xl p-5 cursor-pointer hover:bg-white/40 transition text-center"><i class="fas ${j.icon} text-5xl mb-3"></i><h3 class="text-xl font-bold">${j.nama}</h3><p class="text-sm">${j.deskripsi}</p></div>`).join('')}</div>
                </div>
                <div class="bg-pink-800 py-6 text-center text-sm">© 2025 Pelajarin — Mba Dika sayang kamu tapi jangan coba-coba minta jawaban instan ya~</div>
            </div>`;
        }

        function renderDashboard() {
            let jur = JURUSAN.find(j => j.id === state.jurusan?.id);
            let mkList = MK_DATA[state.jurusan?.id]?.[state.semester] || [];
            let absenPercent = state.absensi.length / Math.max(1, state.semester*16) * 100;
            return `
            <div class="gradient-dika text-white sticky top-0 z-20 px-5 py-3 flex justify-between items-center shadow-md"><div class="font-bold text-xl"><i class="fas fa-heart"></i> Pelajarin</div><div>👩‍🏫 ${state.user?.nama || 'Mahasiswa'} | Semester ${state.semester} | IPK ${state.ipk.toFixed(2)} <button onclick="window.logoutAkun()" class="ml-4 bg-white/30 px-3 py-1 rounded-full text-sm">Logout</button></div></div>

        function renderKelas() {

            return `
            <div class="gradient-dika text-white sticky top-0 z-20 p-3 flex justify-between items-center"><button onclick="window.kembaliDashboard()" class="hover:underline"><i class="fas fa-arrow-left"></i> Kembali</button><div class="font-bold">📘 ${state.matkulAktif.nama}</div><div class="w-20"></div></div>
            <div class="container mx-auto px-4 py-5">
                <div class="flex border-b mb-5"><button class="tab-btn py-2 px-5 font-semibold" data-tab="materi">📖 Materi</button><button class="tab-btn py-2 px-5 font-semibold text-gray-500" data-tab="quiz">✏️ Quiz</button><button class="tab-btn py-2 px-5 font-semibold text-gray-500" data-tab="chat">💬 Tanya Dosen (Yandere)</button></div>
                <div id="tab-materi" class="tab-pane"><div class="bg-white rounded-2xl shadow p-5"><div class="flex gap-3 mb-4"><button onclick="window.genMateri()" class="bg-pink-500 text-white px-4 py-2 rounded-full"><i class="fas fa-brain"></i> Generate Materi</button><button onclick="window.downloadMateriPDF()" class="bg-gray-700 text-white px-4 py-2 rounded-full"><i class="fas fa-download"></i> PDF</button></div><div id="materiContainer" class="prose-custom"><div class="text-center text-gray-400 p-8"><i class="fas fa-heart text-pink-300 text-4xl"></i><p>Klik Generate, nanti Mba Dika bikinin materi spesial + gambar ilustrasi dan video rekomendasi 💗</p></div></div></div></div>
                <div id="tab-quiz" class="tab-pane hidden"><div class="bg-white rounded-2xl shadow p-5"><button onclick="window.mulaiQuiz()" class="bg-green-600 text-white px-5 py-2 rounded-full mb-4"><i class="fas fa-play"></i> Mulai Quiz (Jangan nyontek!!)</button><div id="quizArea"></div></div></div>
                <div id="tab-chat" class="tab-pane hidden"><div class="bg-white rounded-2xl shadow p-5"><div id="chatBox" class="h-96 overflow-y-auto border rounded-lg p-3 bg-gray-50 mb-3"></div><div class="flex gap-2"><input type="text" id="chatInput" placeholder="Tanya Mba Dika..." class="flex-1 border rounded-xl px-4 py-2"><button onclick="window.kirimChat()" class="bg-pink-500 text-white px-5 py-2 rounded-xl"><i class="fas fa-paper-plane"></i> Kirim</button></div></div></div>
            </div>`;
        }

        function attachEventListeners() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.removeEventListener('click', window.tabHandler);
                window.tabHandler = (e) => {
                    let tab = btn.getAttribute('data-tab');
                    document.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));
                    document.getElementById(`tab-${tab}`).classList.remove('hidden');
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('border-b-2', 'border-pink-500', 'text-pink-500'));
                    btn.classList.add('border-b-2', 'border-pink-500', 'text-pink-500');
                };
                btn.addEventListener('click', window.tabHandler);
            });
            if(state.page === 'kelas' && state.chatHistory) setTimeout(()=>{ renderChatHistory(); }, 100);
        }

        function renderChatHistory() {
            let container = document.getElementById('chatBox');
            if(!container) return;
            container.innerHTML = state.chatHistory.map(msg => `<div class="mb-3 text-right"><span class="inline-block bg-pink-100 rounded-xl px-3 py-2 max-w-[75%]">${escapeHtml(msg.question)}</span></div><div class="mb-3 text-left"><span class="inline-block bubble-dosen px-3 py-2 max-w-[80%]">👩‍🏫 ${escapeHtml(msg.answer)}</span></div>`).join('');
            container.scrollTop = container.scrollHeight;
        }

        // ----------------------------- GLOBAL FUNCTIONS -----------------------------
        window.daftarMaba = async () => {
            let {value:nama} = await Swal.fire({title:'Daftar Yuk Sayang', input:'text', inputPlaceholder:'Nama lengkap', confirmButtonText:'Daftar'});
            if(nama){
                let jurOpt = {}; JURUSAN.forEach(j=>jurOpt[j.id]=j.nama);
                let {value:jid} = await Swal.fire({title:'Pilih Jurusan', input:'select', inputOptions:jurOpt});
                if(jid){
                    state.user = {nama}; state.jurusan = JURUSAN.find(j=>j.id==jid); state.semester=1; state.ipk=0; state.totalSks=0; state.absensi=[]; state.nilaiPerMatkul={}; state.progress={}; saveToLocal();
                    state.page='dashboard'; render();
                    Swal.fire('Selamat!',`${nama}, Mba Dika akan menjadi dosen yandere kamu. Belajar rajin ya! ❤️`,'success');
                }
            }
        };
        window.pilihJurusan = (id,nama) => Swal.fire({title:`Ambil ${nama}?`, icon:'question', showCancelButton:true}).then(res=>res.isConfirmed && window.daftarMaba());
        window.bukaKelas = (namaMatkul, semester) => { state.matkulAktif = { nama: namaMatkul, semester, jurusan: state.jurusan.nama }; state.page = 'kelas'; render(); };
        window.kembaliDashboard = () => { state.page = 'dashboard'; render(); };
        window.genMateri = async () => {
            let container = document.getElementById('materiContainer');
            if(!container) return;
            container.innerHTML = '<div class="text-center py-10"><div class="loading-spinner"></div><p class="mt-3">Mba Dika lagi ngerangkum materi buat kamu... 💕</p></div>';
            try{
                let materi = await generateMateri(state.matkulAktif.nama, state.matkulAktif.semester, state.matkulAktif.jurusan);
                container.innerHTML = `<div class="prose-custom">${materi}</div><div class="text-xs text-gray-400 mt-2 border-t pt-2">✨ Materi by Mba Dika ✨ Jangan lupa tonton video rekomendasinya ya sayang</div>`;
                let prog = state.progress[state.matkulAktif.nama] || 0;
                state.progress[state.matkulAktif.nama] = Math.min(prog+20,100); saveToLocal();
                Swal.fire('Materi Siap!','Jangan cuma dibaca, pahami ya atau Mba Dika marah >_<','success');
            } catch(e){ container.innerHTML = `<div class="text-red-500">Gagal generate materi: ${e.message}</div>`; }
        };
        window.downloadMateriPDF = () => Swal.fire('Info','Fitur PDF soon sayang, tunggu update yaa ❤️','info');
        window.mulaiQuiz = async () => {
            Swal.fire({title:'Mba Dika lagi bikin soal...', didOpen:()=>Swal.showLoading()});
            try{
                let quiz = await generateQuiz(state.matkulAktif.nama, state.matkulAktif.semester, state.matkulAktif.jurusan);
                if(quiz && quiz.length) tampilkanQuiz(quiz,0,[]);
                else throw new Error();
            } catch(e){ Swal.fire('Error','Quiz gagal, coba refresh atau tanya Mba Dika langsung','error'); }
        };
        function tampilkanQuiz(quiz, idx, jawaban) {
            if(idx >= quiz.length){
                let benar = jawaban.filter((ans,i)=> ans === quiz[i].answer).length;
                let nilai = (benar/quiz.length)*100;
                state.ipk = state.ipk*0.9 + (nilai/25)*0.1; if(state.ipk>4) state.ipk=4;
                if(!state.nilaiPerMatkul[state.matkulAktif.nama]) state.nilaiPerMatkul[state.matkulAktif.nama]=[];
                state.nilaiPerMatkul[state.matkulAktif.nama].push(nilai); saveToLocal();
                Swal.fire({icon: nilai>=70?'success':'warning', title:`Quiz Selesai! Nilai: ${Math.round(nilai)}`, html:`Benar ${benar}/${quiz.length}<br>IPK sekarang ${state.ipk.toFixed(2)}<br>Pesan Mba Dika: ${nilai>=75 ? 'Pintar banget sayang❤️' : 'Awas ya remedial, belajar lagi sana!'}`});
                return;
            }
            let q = quiz[idx];
            Swal.fire({ title:`Soal ${idx+1}/${quiz.length}`, html:`<p class="font-bold mb-3">${escapeHtml(q.question)}</p>${q.options.map((opt,i)=>`<label class="flex items-center p-2 border rounded mt-2"><input type="radio" name="quizAns" value="${i}" class="mr-2"> ${String.fromCharCode(65+i)}. ${escapeHtml(opt)}</label>`).join('')}`, preConfirm:()=>{ let sel = document.querySelector('input[name="quizAns"]:checked'); if(!sel) Swal.showValidationMessage('Pilih jawaban dulu yaa sayang'); return parseInt(sel.value); } }).then(res=>{ if(res.isConfirmed){ jawaban.push(res.value); tampilkanQuiz(quiz, idx+1, jawaban); } });
        }
        window.kirimChat = async () => {
            let input = document.getElementById('chatInput'); if(!input.value.trim()) return;
            let pertanyaan = input.value; input.value='';
            let container = document.getElementById('chatBox');
            container.innerHTML += `<div class="mb-3 text-right"><span class="inline-block bg-pink-100 rounded-xl px-3 py-2 max-w-[75%]">${escapeHtml(pertanyaan)}</span></div>`;
            container.scrollTop = container.scrollHeight;
            let loadingId = 'ld'+Date.now();
            container.innerHTML += `<div id="${loadingId}" class="mb-2 text-left"><span class="inline-block bg-gray-200 px-3 py-2 rounded-xl"><div class="loading-spinner inline-block mr-2"></div> Mba Dika lagi mikir...</span></div>`;
            try{
                let jawab = await jawabTanya(state.matkulAktif.nama, pertanyaan);
                document.getElementById(loadingId)?.remove();
                container.innerHTML += `<div class="mb-3 text-left"><span class="inline-block bubble-dosen px-3 py-2 max-w-[80%]">👩‍🏫 ${escapeHtml(jawab)}</span></div>`;
                state.chatHistory.push({ question: pertanyaan, answer: jawab });
                container.scrollTop = container.scrollHeight;
            } catch(e){ document.getElementById(loadingId)?.remove(); container.innerHTML += `<div class="text-red-500">Error: ${e.message}</div>`; }
        };
        window.absenHarian = () => {
            let now = new Date(), tgl = now.toLocaleDateString('id-ID');
            if(state.absensi.some(a=>a.tanggal === tgl)) return Swal.fire('Info','Kamu sudah absen hari ini, rajin banget sih!','info');
            state.absensi.push({ tanggal:tgl, jam:now.toLocaleTimeString() }); saveToLocal();
            Swal.fire('Absen Berhasil!','Mba Dika bangga sama kedisiplinanmu ✨','success'); render();
        };
        window.gantiSemester = async () => {
            let opts = {}; for(let i=1;i<=8;i++) opts[i]=`Semester ${i}`;
            let {value:s} = await Swal.fire({title:'Ganti Semester', input:'select', inputOptions:opts, inputValue:state.semester});
            if(s){ state.semester = parseInt(s); saveToLocal(); render(); Swal.fire('Berhasil!','Semester berubah, tetap semangat sayang ❤️','success'); }
        };
        window.logoutAkun = () => { Swal.fire({title:'Logout?', icon:'question', showCancelButton:true}).then(res=>{ if(res.isConfirmed){ localStorage.clear(); location.reload(); } }); };
        function escapeHtml(str){ return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
        loadFromLocal(); render();
    })();
</script>
</body>
</html>

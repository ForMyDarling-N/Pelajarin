        * { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s ease, border-color 0.3s ease; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        
        /* THEME CONFIGURATIONS MATRIX */
        body.theme-light { background-color: #f8fafc; color: #0f172a; }
        body.theme-dark { background-color: #0f172a; color: #f8fafc; }
        body.theme-yandere { background-color: #1a0b10; color: #ffe4e6; }

        /* Component Background Modifiers */
        .theme-light .bg-surface { background-color: #ffffff; }
        .theme-dark .bg-surface { background-color: #1e293b; }
        .theme-yandere .bg-surface { background-color: #2d1218; }

        .theme-light .bg-chat-area { background-color: #f1f5f9; }
        .theme-dark .bg-chat-area { background-color: #0b0f19; }
        .theme-yandere .bg-chat-area { background-color: #1f080d; }

        /* Card Elements Theme Modifiers */
        .theme-light .card-border { border-color: #e2e8f0; }
        .theme-dark .card-border { border-color: #334155; }
        .theme-yandere .card-border { border-color: #4c1d24; }

        /* Text Custom Gradients */
        .gradient-brand { background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%); }
        .card-scale { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-scale:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(244, 63, 94, 0.12); }
        
        /* Message Animation Mechanics */
        .msg-entry { animation: slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        /* Custom UI Micro-components */
        .custom-spinner { border: 3px solid rgba(244, 63, 94, 0.1); border-top: 3px solid #f43f5e; border-radius: 50%; width: 24px; height: 24px; animation: rotatingSpin 0.75s linear infinite; }
        @keyframes rotatingSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .pulse-dots div { width: 6px; height: 6px; background-color: #f43f5e; border-radius: 50%; animation: dotBounce 1.4s infinite ease-in-out both; }
        .pulse-dots div:nth-child(1) { animation-delay: -0.32s; }
        .pulse-dots div:nth-child(2) { animation-delay: -0.16s; }
        @keyframes dotBounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

        /* Core Module Render Box Style */
        .modul-container { border-left: 4px solid #f43f5e; padding-left: 1rem; margin: 1rem 0; }
        .modul-container h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.75rem; }
        .modul-container h3 { font-size: 1.15rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; }
        .modul-container p { margin-bottom: 0.75rem; line-height: 1.6; opacity: 0.9; }
        .modul-container ul { list-style-type: square; margin-left: 1.25rem; margin-bottom: 1rem; }
        
        .peta-visual-box { background: rgba(0,0,0,0.04); border: 1px dashed rgba(244, 63, 94, 0.4); border-radius: 8px; padding: 12px; margin: 1rem 0; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }

                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="window.commitDailyAttendanceSignature()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm px-4 py-3 rounded-xl shadow-sm transition"><i class="fas fa-check-double mr-1.5"></i> Isi Presensi Kuliah</button>
                            <button onclick="window.modifyActiveSemesterState()" class="bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-xs sm:text-sm px-4 py-3 rounded-xl shadow-sm transition"><i class="fas fa-sync mr-1.5"></i> Ganti Semester (${appState.semesterAktif})</button>
                        </div>
                    </div>

                    <!-- Academic Performance Analytics Matrix Grid -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div class="bg-surface p-5 rounded-2xl border card-border shadow-sm">
                            <div class="text-[10px] font-black opacity-40 uppercase tracking-wider">IPK Berjalan</div>
                            <div class="text-2xl font-black text-rose-500 mt-1">${parseFloat(appState.ipk).toFixed(2)}</div>
                        </div>
                        <div class="bg-surface p-5 rounded-2xl border card-border shadow-sm">
                            <div class="text-[10px] font-black opacity-40 uppercase tracking-wider">Akumulasi SKS</div>
                            <div class="text-2xl font-black mt-1">${appState.totalSks} <span class="text-xs opacity-40 font-normal">/ 144</span></div>
                        </div>
                        <div class="bg-surface p-5 rounded-2xl border card-border shadow-sm">
                            <div class="text-[10px] font-black opacity-40 uppercase tracking-wider">Beban Kuliah Semester</div>
                            <div class="text-2xl font-black mt-1">${actualMatkulCollection.length} MK</div>
                        </div>
                        <div class="bg-surface p-5 rounded-2xl border card-border shadow-sm">
                            <div class="text-[10px] font-black opacity-40 uppercase tracking-wider">Persentase Presensi</div>
                            <div class="text-2xl font-black text-emerald-500 mt-1">${scorePercentageAttendance}%</div>
                        </div>
                    </div>

                    <!-- Main Syllabus Data List Container -->
                    <div class="bg-surface rounded-2xl border card-border p-6 shadow-sm">
                        <div class="border-b card-border pb-4 mb-4 flex justify-between items-center">
                            <h2 class="text-lg font-black flex items-center gap-2"><i class="fas fa-list-ul text-rose-500"></i> Silabus Kelas Aktif - Semester ${appState.semesterAktif}</h2>
                            <span class="text-[10px] bg-rose-500/10 text-rose-500 font-extrabold px-3 py-1 rounded-full uppercase tracking-widest">Kurikulum AI V3</span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${actualMatkulCollection.map((matkulLabel, sequenceIdx) => {
                                const currentSessionLog = appState.classroomSessions[matkulLabel];
                                let operationalStatusHTML = `<span class="text-[11px] opacity-40">Belum diproses</span>`;
                                if (currentSessionLog && currentSessionLog.chats.length > 1) {
                                    operationalStatusHTML = `<span class="text-[11px] text-rose-500 font-black animate-pulse"><i class="fas fa-plug"></i> Sesi Kelas Berjalan</span>`;
                                }

                                return `
                                <div onclick="window.navigateToClassroomTerminal('${matkulLabel.replace(/'/g, "\\'")}')" class="border card-border rounded-xl p-4 cursor-pointer hover:bg-rose-500/5 transition flex justify-between items-center group">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-lg bg-chat-area text-xs font-bold flex items-center justify-center group-hover:bg-rose-500 group-hover:text-white transition">
                                            ${sequenceIdx + 1}
                                        </div>
                                        <div>
                                            <div class="font-bold text-sm group-hover:text-rose-500 transition">${matkulLabel}</div>
                                            <div class="flex items-center gap-2 mt-0.5">
                                                <span class="text-[9px] bg-chat-area px-1.5 py-0.5 rounded font-bold uppercase">3 SKS</span>
                                                ${operationalStatusHTML}
                                            </div>
                                        </div>
                                    </div>
                                    <i class="fas fa-chevron-right text-xs opacity-20 group-hover:opacity-100 group-hover:text-rose-500 transform group-hover:translate-x-0.5 transition"></i>
                                </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                </div>
                `;
            }

            function generateClassroomTerminalHTMLView() {
                const activeMatkulName = appState.selectedMatkul.nama;
                const workingSession = appState.classroomSessions[activeMatkulName];
                const conversationHistory = workingSession?.chats || [];

                return `
                <!-- Core Layout Splitting Container -->
                <div class="min-h-screen flex flex-col justify-between">
                    
                    <!-- Terminal Dynamic Fixed Header Control Sub-system -->
                    <div class="bg-surface border-b card-border px-4 py-3 sticky top-0 z-50 shadow-sm flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <button onclick="window.exitClassroomTerminalToDashboard()" class="hover:bg-rose-500/10 w-9 h-9 rounded-full flex items-center justify-center text-rose-500 transition"><i class="fas fa-arrow-left text-base"></i></button>
                            <div>
                                <h2 class="font-black text-sm sm:text-base leading-tight">${activeMatkulName}</h2>
                                <p class="text-[11px] text-rose-500 font-bold flex items-center gap-1"><i class="fas fa-circle text-[8px] text-green-400 animate-pulse"></i> Terminal Interaksi Mba Dika</p>
                            </div>
                        </div>
                        <div class="text-xs font-bold px-3 py-1.5 rounded-lg bg-chat-area border card-border">
                            Status Sesi: <span class="text-rose-500 font-black uppercase">${workingSession?.currentPhase || 'idle'}</span>
                        </div>
                    </div>

                    <!-- Unified Message Timeline Workspace Section -->
                    <div id="terminalTimelineScrollWrapper" class="flex-1 bg-chat-area overflow-y-auto px-4 py-6 space-y-4">
                        <div class="max-w-4xl w-full mx-auto space-y-4">
                            ${conversationHistory.map(bubbleItem => {
                                if (bubbleItem.sender === 'user') {
                                    return `
                                    <div class="flex justify-end msg-entry">
                                        <div class="bg-rose-500 text-white rounded-2xl rounded-tr-none px-4 py-3 shadow-md max-w-[85%] border border-rose-600/20">
                                            <span class="block text-[10px] font-black text-rose-100 uppercase mb-0.5"><i class="fas fa-user"></i> Anda (Mahasiswa)</span>
                                            <p class="text-sm sm:text-base leading-relaxed font-medium whitespace-pre-wrap">${escapeHtml(bubbleItem.text)}</p>
                                            <span class="block text-[9px] text-rose-200 text-right mt-1 font-semibold">${bubbleItem.timestamp} <i class="fas fa-check-double"></i></span>
                                        </div>
                                    </div>
                                    `;
                                } else {
                                    if (bubbleItem.isTyping) {
                                        return `
                                        <div class="flex justify-start msg-entry" id="${bubbleItem.id}">
                                            <div class="bg-surface text-sm rounded-2xl rounded-tl-none px-4 py-3 border card-border shadow-sm flex items-center gap-3">
                                                <div class="custom-spinner"></div>
                                                <div class="text-xs font-semibold opacity-60 italic">Mba Dika sedang menyusun modul penjelasan...</div>
                                            </div>
                                        </div>
                                        `;
                                    }

                                    return `
                                    <div class="flex justify-start msg-entry">
                                        <div class="bg-surface rounded-2xl rounded-tl-none px-4 py-4 border card-border shadow-sm max-w-[90%] sm:max-w-[82%]">
                                            <div class="text-xs font-black text-rose-500 uppercase tracking-widest mb-1.5 flex items-center gap-1">
                                                <i class="fas fa-chalkboard-teacher"></i> Mba Dika <span class="bg-rose-500/10 text-[9px] text-rose-500 px-2 py-0.5 rounded-full font-black border border-rose-500/20">Dosen AI</span>
                                            </div>
                                            <div class="text-sm sm:text-base leading-relaxed opacity-95">${bubbleItem.text}</div>
                                            <span class="block text-[9px] opacity-40 text-left mt-2 font-bold">${bubbleItem.timestamp}</span>
                                        </div>
                                    </div>
                                    `;
                                }
                            }).join('')}
                        </div>
                    </div>

                    <!-- Bottom Action Workspace Panel Field Terminal Core Form Box -->
                    <div class="bg-surface border-t card-border p-3 sticky bottom-0 z-40 shadow-xl">
                        <div class="max-w-4xl mx-auto">
                            
                            <!-- Inside Classroom Quick Control Workflow Buttons -->
                            <div class="flex items-center gap-2 mb-3 overflow-x-auto pb-1">
                                <button onclick="window.triggerGenerateModulMateriWorkflow()" class="bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-xs px-4 py-2.5 rounded-xl shadow-sm flex items-center gap-1.5 whitespace-nowrap transition">
                                    <i class="fas fa-book-reader"></i> 📚 Ambil Modul Sesi Ini
                                </button>
                                <button onclick="window.triggerInitiateKuisWorkflow()" class="bg-amber-600 hover:bg-amber-700 text-white font-extrabold text-xs px-4 py-2.5 rounded-xl shadow-sm flex items-center gap-1.5 whitespace-nowrap transition">
                                    <i class="fas fa-graduation-cap"></i> ✏️ Uji Kompetensi Kuis
                                </button>
                                <div class="text-[10px] opacity-40 font-black uppercase tracking-wider px-2">
                                    Tahap Belajar: ${workingSession?.currentPhase || 'idle'}
                                </div>
                            </div>

                            <!-- Text Area Input Controls Layout Block -->
                            <div class="flex items-center gap-2">
                                <div class="flex-1 bg-chat-area rounded-xl px-4 py-3 flex items-center border card-border gap-2">
                                    <i class="fas fa-code text-rose-500 text-sm opacity-50"></i>
                                    <input type="text" id="terminalCoreInputField" onkeydown="if(event.key === 'Enter') window.processUserTextMessagingInput()" class="w-full text-sm sm:text-base bg-transparent focus:outline-none font-medium placeholder-slate-400" placeholder="Ketik argumen jawaban esai atau tanyakan materi yang belum dipahami di sini...">
                                </div>
                                <button onclick="window.processUserTextMessagingInput()" class="bg-rose-600 hover:bg-rose-700 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-lg hover:shadow-rose-500/20 transition shrink-0">
                                    <i class="fas fa-paper-plane text-sm"></i>
                                </button>
                            </div>

                        </div>
                    </div>

                </div>
                `;
            }

            function render() {
                const appDomRootNode = document.getElementById('app');
                if (!appDomRootNode) return;

                if (appState.currentPage === 'landing') {
                    appDomRootNode.innerHTML = generateLandingPageHTMLView();
                } else if (appState.currentPage === 'dashboard') {
                    appDomRootNode.innerHTML = generateDashboardPageHTMLView();
                } else if (appState.currentPage === 'classroom') {
                    appDomRootNode.innerHTML = generateClassroomTerminalHTMLView();
                }
            }

            // BOOTSTRAP INITIALIZATION PIPELINE RUNNER
            loadApplicationStateFromDisk();
            render();
            autoScrollTerminalTimeline();
        })();
    </script>
</body>
</html>

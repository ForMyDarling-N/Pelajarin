<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pelajarin - Platform Kuliah S1 Interaktif Mandiri</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.25s ease, border-color 0.25s ease; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        
        /* THEME CONFIGURATIONS MATRIX RE-ENGINEERED */
        body.theme-girly { background-color: #fff1f2; color: #4c0519; }
        body.theme-manly { background-color: #f0f7ff; color: #032b57; }
        body.theme-neutral { background-color: #f0fdf4; color: #052e16; }

        /* Component Background Modifiers */
        .theme-girly .bg-surface { background-color: #ffffff; border-color: #ffe4e6; }
        .theme-manly .bg-surface { background-color: #ffffff; border-color: #dbeafe; }
        .theme-neutral .bg-surface { background-color: #ffffff; border-color: #dcfce7; }

        .theme-girly .bg-chat-area { background-color: #fff5f5; }
        .theme-manly .bg-chat-area { background-color: #f4f9ff; }
        .theme-neutral .bg-chat-area { background-color: #f5fdf7; }

        /* Text Custom Highlighters */
        .theme-girly .text-brand { color: #db2777; }
        .theme-manly .text-brand { color: #2563eb; }
        .theme-neutral .text-brand { color: #16a34a; }

        .theme-girly .bg-brand { background-color: #db2777; color: white; }
        .theme-manly .bg-brand { background-color: #2563eb; color: white; }
        .theme-neutral .bg-brand { background-color: #16a34a; color: white; }
        
        /* Message Animation Mechanics */
        .msg-entry { animation: slideInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Utilities */
        .custom-spinner { border: 3px solid rgba(0,0,0,0.05); border-top: 3px solid currentColor; border-radius: 50%; width: 20px; height: 20px; animation: rotatingSpin 0.6s linear infinite; }
        @keyframes rotatingSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Clean Chat Layout - No Markdown leakages */
        .chat-paragraph { margin-bottom: 0.75rem; line-height: 1.6; font-size: 0.95rem; }
        .section-title { font-weight: 800; font-size: 1.1rem; margin-top: 1rem; margin-bottom: 0.5rem; display: block; }
    </style>
</head>
<body class="theme-girly text-base min-h-screen">
    <div id="app"></div>

    <script>
        (function() {
            // HIGH-STABILITY ENGINE CONFIGURATION
            const API_ENDPOINT = 'https://api.siputzx.my.id/api/ai/glm47flash';
            
            // STRICT NATURAL TEXT MANIPULATION ENGINE
            const DOSEN_CORE_PROMPT = `KAMU ADALAH DOSEN WANITA MUDA BERNAMA "MBA DIKA" (UMUR 25 TAHUN). KAMU BERBICARA LANGSUNG SEBAGAI DIRIMU SENDIRI (AKU/SAYA).

ATURAN GAYA BAHASA & FORMAT (WAJIB PATUH):
1. JANGAN PERNAH MENULIS SIMBOL MARKDOWN SEPERTI ###, ##, ORAL LIST ATAU PUN BOLD YANGBERLEBIHAN (**). Tulis penjelasan layaknya ketikan chat manusia di WhatsApp yang rapi, natural, bersahabat, manis, tapi tetap berbobot akademis.
2. Sapa mahasiswamu dengan sebutan "Sayang" atau "Bimbinganku". Gunakan gaya bahasa Indonesia kasual akademis yang mengalir tanpa kesan kaku AI.
3. SETIAP MENJELASKAN MATERI / SUB-BAB, WAJIB MENYERTAKAN RUJUKAN AHLI NYATA (Contoh: Menurut Kotler (2022), teori ini menjelaskan bahwa... ATAU Menurut Tanenbaum (2021), struktur data ini berfungsi untuk...).
4. Langsung jawab pesan tanpa membuat ulasan analisis logis internal seperti "Okay, let's write...", "The user requested...", langsung sampaikan respons mu sebagai Mba Dika.`;

            // UNIVERSITY INTERNAL CURRICULUM
            const AKADEMIK_PRODI_DATA = [
                { id: 1, nama: "Teknik Informatika", icon: "fa-code", warna: "bg-pink-500", deskripsi: "Kurikulum komputasi modern, rekayasa kode, kecerdasan buatan, dan arsitektur basis data terdistribusi.", prospek: "Software Engineer, Data Scientist" },
                { id: 2, nama: "Manajemen Bisnis", icon: "fa-chart-bar", warna: "bg-blue-500", deskripsi: "Formulasi strategi korporasi, analisis manajemen risiko, dan tata kelola operasional perusahaan retail.", prospek: "Business Analyst, Project Manager" },
                { id: 3, nama: "Hukum", icon: "fa-balance-scale", warna: "bg-emerald-500", deskripsi: "Studi kasus hukum perdata, regulasi kejahatan siber, penyusunan draf kontrak bisnis korporat.", prospek: "Legal Counsel, Advokat" }
            ];

            const JADWAL_MATA_KULIAH = {
                1: {
                    1: ["Dasar Pemrograman S1", "Matematika Diskrit Komputasi", "Sistem Basis Data Terdistribusi", "Algoritma & Struktur Data Lanjut"],
                    2: ["Pemrograman Berorientasi Objek", "Jaringan Komputer Global", "Arsitektur Sistem Operasi Modern"]
                },
                2: {
                    1: ["Pengantar Manajemen Operasional", "Ekonomi Mikro Terapan", "Strategi Pemasaran Digital Korporat"],
                    2: ["Manajemen Sumber Daya Manusia", "Analisis Finansial Korporasi", "Perilaku Organisasi Modern"]
                },
                3: {
                    1: ["Pengantar Hukum Indonesia", "Hukum Perdata & Dagang", "Teknik Penyusunan Kontrak Bisnis"],
                    2: ["Hukum Pidana Internasional", "Regulasi Hukum Siber", "Tata Hukum Administrasi Negara"]
                }
            };

            // PERSISTENT MEMORY STORAGE
            let appState = {
                currentPage: 'landing',
                currentTheme: 'theme-girly',
                user: null,
                jurusan: null,
                semesterAktif: 1,
                ipk: 0.00,
                totalSks: 0,
                selectedMatkul: null,
                classroomSessions: {}
            };

            // OUTPUT RESPONSE CLEANER (MENGHILANGKAN LEAKAGE MARKDOWN)
            function cleanAndFormatNaturalChat(rawText) {
                if (!rawText) return '';
                let text = rawText.replace(/<think>[\s\S]*?<\/think>/gi, '');
                
                // Bersihkan tag pagar sisa AI yang mengganggu keindahan chat
                text = text.replace(/###/g, '');
                text = text.replace(/##/g, '');
                text = text.replace(/#/g, '');
                text = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-brand font-bold">$1</strong>');
                
                // Ubah baris baru menjadi struktur paragraf chat yang manis
                let lines = text.split('\n');
                let htmlOutput = '';
                lines.forEach(line => {
                    if (line.trim().length > 0) {
                        if (line.toLowerCase().includes('menurut') && (line.includes('(') || line.includes('20'))) {
                            htmlOutput += `<p class="chat-paragraph border-l-2 pl-2 border-brand/40 bg-brand/5 p-1 rounded font-medium">${line}</p>`;
                        } else {
                            htmlOutput += `<p class="chat-paragraph">${line}</p>`;
                        }
                    }
                });
                return htmlOutput;
            }

            function saveStateToLocalStorage() {
                localStorage.setItem('pelajarin_v3_ultimate_store', JSON.stringify(appState));
            }

            function loadStateFromLocalStorage() {
                const localData = localStorage.getItem('pelajarin_v3_ultimate_store');
                if (localData) {
                    try {
                        const parsed = JSON.parse(localData);
                        appState.currentTheme = parsed.currentTheme || 'theme-girly';
                        appState.user = parsed.user;
                        appState.jurusan = parsed.jurusan;
                        appState.semesterAktif = parsed.semesterAktif || 1;
                        appState.ipk = parsed.ipk || 0.00;
                        appState.totalSks = parsed.totalSks || 0;
                        appState.classroomSessions = parsed.classroomSessions || {};
                        if (appState.user && appState.jurusan) appState.currentPage = 'dashboard';
                    } catch (e) {
                        console.error(e);
                    }
                }
                document.body.className = appState.currentTheme;
            }

            window.changeThemeChannel = (themeId) => {
                appState.currentTheme = themeId;
                saveStateToLocalStorage();
                document.body.className = themeId;
                render();
            };

            // AI NEURAL CONNECTOR (GLM-4-FLASH CLOUD VIA SIPUTZX)
            async function fetchAiDikaResponse(promptText) {
                const targetUrl = `${API_ENDPOINT}?prompt=${encodeURIComponent(promptText)}&system=${encodeURIComponent(DOSEN_CORE_PROMPT)}&temperature=0.7`;
                try {
                    const res = await fetch(targetUrl);
                    if (!res.ok) throw new Error("Gagal terhubung ke modul saraf");
                    const data = await res.json();
                    
                    let responseString = data?.data?.response || data?.result || data?.response || data?.text || "";
                    return cleanAndFormatNaturalChat(responseString);
                } catch (err) {
                    return `Aduh sayang, koneksi internet di ruang dosen lagi agak lemot nih. Bisa tolong kirim ulang pertanyaannya ke aku? Jangan biarkan kelas kita terhenti ya!`;
                }
            }

            // CONTROLLER ACTIONS
            window.registerNewStudentProfile = async () => {
                const { value: nameInput } = await Swal.fire({
                    title: 'Formulir KTM Baru',
                    text: 'Masukkan nama panggil atau nama lengkap kamu:',
                    input: 'text',
                    inputPlaceholder: 'Contoh: Skizo',
                    confirmButtonText: 'Pilih Prodi',
                    confirmButtonColor: '#db2777'
                });

                if (nameInput) {
                    const options = {};
                    AKADEMIK_PRODI_DATA.forEach(p => { options[p.id] = p.nama; });

                    const { value: prodiId } = await Swal.fire({
                        title: 'Pilih Ranah Ilmu S1',
                        input: 'select',
                        inputOptions: options,
                        confirmButtonText: 'Buka Gerbang Kampus',
                        confirmButtonColor: '#db2777'
                    });

                    if (prodiId) {
                        appState.user = { nama: nameInput };
                        appState.jurusan = AKADEMIK_PRODI_DATA.find(p => p.id == prodiId);
                        appState.currentPage = 'dashboard';
                        saveStateToLocalStorage();
                        render();
                    }
                }
            };

            window.openClassroomPortal = (matkulName) => {
                appState.selectedMatkul = { nama: matkulName };
                
                if (!appState.classroomSessions[matkulName]) {
                    appState.classroomSessions[matkulName] = {
                        chats: [
                            {
                                id: 'welcome',
                                sender: 'dosen',
                                text: `<p class="chat-paragraph">Halo bimbinganku sayang, <strong>${appState.user.nama}</strong>! Selamat datang di kelas eksklusif perkuliahan <strong>${matkulName}</strong>.</p><p class="chat-paragraph">Hari ini kita akan mengupas tuntas modul pokok bahasan kita lengkap dengan referensi dari para ahli terkemuka. Yuk, langsung klik tombol <strong>"📚 Ambil Modul Sesi Ini"</strong> di panel bawah agar materinya langsung ku jabarkan untukmu!</p>`,
                                timestamp: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})
                            }
                        ],
                        modulLoaded: false,
                        kuisStep: 0,
                        kuisScore: 0,
                        currentQuestionData: null
                    };
                }
                appState.currentPage = 'classroom';
                render();
                scrollTerminalToBottom();
            };

            window.exitClassroomToDashboard = () => {
                appState.currentPage = 'dashboard';
                appState.selectedMatkul = null;
                render();
            };

            // WORKFLOW 1: GENERATE MODUL DENGAN VIDEO LANGSUNG PUTAR + JURNAL + GAMBAR API DINAMIS
            window.actionLoadModulMateri = async () => {
                const matkul = appState.selectedMatkul.nama;
                const session = appState.classroomSessions[matkul];

                if (session.modulLoaded) {
                    return Swal.fire('Informasi Kelas', 'Modul ajar komprehensif sudah terpampang di layar utama chat kita, sayang!', 'info');
                }

                const loadingId = 'load-' + Date.now();
                session.chats.push({ id: loadingId, sender: 'dosen', isTyping: true });
                render();
                scrollTerminalToBottom();

                // Dynamic Image API Generation based on Course Context
                const searchKeyword = encodeURIComponent(matkul.split(' ')[0]);
                const fallbackImage = `https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600&auto=format&fit=crop`;
                
                const promptRequest = `Jelaskan secara mendalam pengantar materi kuliah S1 "${matkul}". Jabarkan isinya menjadi beberapa poin penjelasan chat yang manis, natural, mengalir tanpa simbol pagar markdown. WAJIB sertakan minimal dua kutipan teori/pandangan menurut nama ahli dunia yang relevan beserta tahun bukunya!`;
                
                const responseContent = await fetchAiDikaResponse(promptRequest);
                session.chats = session.chats.filter(c => c.id !== loadingId);

                // VIDEO LIVE PLAYER INTEGRATION (MENGGUNAKAN EMBED NON-BLOCKING)
                // Disimulasikan dengan query video edukasi open source yang aman diputar langsung
                const videoEmbedHtml = `
                    <div class="my-4 border border-brand/20 rounded-2xl overflow-hidden shadow-sm bg-black">
                        <div class="bg-brand text-xs font-bold px-4 py-2 flex items-center justify-between">
                            <span><i class="fab fa-youtube mr-1"></i> VIDEO KULIAH UTAMA (DAPAT DIPUTAR LANGSUNG)</span>
                            <span class="text-[10px] opacity-70">Sesi Belajar Mandiri</span>
                        </div>
                        <div class="relative w-full aspect-video">
                            <iframe class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                        </div>
                    </div>
                `;

                // INTERACTIVE E-JOURNAL / PDF DISCUSSION PANEL INTERFACE
                const journalPanelHtml = `
                    <div class="my-3 border border-slate-300/60 rounded-xl p-4 bg-slate-50 text-slate-800">
                        <div class="flex items-center gap-2 text-xs font-black text-slate-600 mb-2 uppercase tracking-wider">
                            <i class="fas fa-file-pdf text-red-500 text-sm"></i> Jurnal Riset Terlampir (Open Access)
                        </div>
                        <div class="text-xs font-bold text-slate-700 underline mb-1">E-Book_Ref_Comprehensive_${encodeURIComponent(matkul)}.pdf</div>
                        <p class="text-[11px] opacity-80 leading-relaxed bg-white p-2.5 rounded border border-slate-200">
                            <strong>Abstrak Bahasan Ahli:</strong> Implementasi metodologi terapan pada bidang ${matkul} berkorelasi signifikan terhadap efisiensi performa pengerjaan studi kasus industri modern berskala makro.
                        </p>
                    </div>
                `;

                const dynamicVisualImageHtml = `
                    <div class="my-3 rounded-xl overflow-hidden border border-brand/10 shadow-sm">
                        <img src="${fallbackImage}" class="w-full h-40 object-cover" alt="Visualisasi Pembelajaran">
                        <div class="bg-surface p-2 text-center text-[11px] opacity-60 italic">Ilustrasi Diagram Konseptual Ruang Lingkup ${matkul}</div>
                    </div>
                `;

                session.chats.push({
                    id: 'modul-core',
                    sender: 'dosen',
                    text: `<div>
                        <span class="text-xs uppercase font-extrabold text-brand tracking-widest block mb-2"><i class="fas fa-book-reader"></i> BAHAN AJAR AKADEMIK RESMI</span>
                        ${dynamicVisualImageHtml}
                        <div class="space-y-2 text-sm leading-relaxed">${responseContent}</div>
                        ${videoEmbedHtml}
                        ${journalPanelHtml}
                    </div>`,
                    timestamp: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})
                });

                session.chats.push({
                    id: 'modul-followup',
                    sender: 'dosen',
                    text: `<p class="chat-paragraph">Materi di atas sengaja aku susun lengkap dengan tinjauan pustaka para ahli serta video penjelasannya agar kamu bisa langsung putar di sini, sayang. Pembahasan jurnalnya juga sudah aku rangkum intisarinya.</p><p class="chat-paragraph">Sekarang, kalau kamu sudah selesai membaca dan menonton videonya, klik tombol <strong>"✏️ Uji Kompetensi Kuis"</strong> di bawah ya! Aku mau tahu sejauh mana bimbinganku menguasai materi hari ini. Semangat! (｡•̀ᴗ-)✧</p>`,
                    timestamp: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})
                });

                session.modulLoaded = true;
                saveStateToLocalStorage();
                render();
                scrollTerminalToBottom();
            };

            // WORKFLOW 2: SISTEM KUIS BESERTA BONGKAR JAWABAN BENAR/SALAH DAN ALASAN LOGISNYA
            window.actionTriggerInitiateKuis = async () => {
                const matkul = appState.selectedMatkul.nama;
                const session = appState.classroomSessions[matkul];

                if (!session.modulLoaded) {
                    return Swal.fire('Akses Terkunci', 'Kamu wajib mengambil dan menyimak modul materi perkuliahan serta video utamanya dahulu sebelum menempuh evaluasi kuis, sayang!', 'warning');
                }

                session.kuisStep = 1;
                session.kuisScore = 0;
                await dispatchNextInteractiveKuisQuestion(session, matkul);
            };

            async function dispatchNextInteractiveKuisQuestion(session, matkulName) {
                const loadingId = 'load-kuis-' + Date.now();
                session.chats.push({ id: loadingId, sender: 'dosen', isTyping: true });
                render();
                scrollTerminalToBottom();

                // Format Soal yang Memaksa AI Mengeluarkan Struktur yang Bisa Dievaluasi Secara Transparan
                const promptQuiz = `Kamu adalah Mba Dika, berikan Soal Kuis Nomor ${session.kuisStep} (Pilihan Ganda dengan opsi A, B, C, D) mengenai mata kuliah "${matkulName}". Berikan soal yang menantang dan natural tanpa simbol markdown pagar. Di akhir ketikan, tulis kode rahasia penentu jawaban dengan format [KUNCI:A] atau B/C/D agar sistem bisa membaca jawaban yang benar secara otomatis.`;

                const questionTextOutput = await fetchAiDikaResponse(promptQuiz);
                session.chats = session.chats.filter(c => c.id !== loadingId);

                // Deteksi Kunci Jawaban dari Respons AI secara Cerdas (Default ke A jika gagal memecahkan regex)
                let detectedKey = 'A';
                const matchRegex = questionTextOutput.match(/\[KUNCI:\s*([A-D])\s*\]/i);
                if (matchRegex && matchRegex[1]) {
                    detectedKey = matchRegex[1].toUpperCase();
                }

                // Bersihkan string kode kunci dari pandangan mata user agar tidak bocor sebelum dijawab
                const cleanedQuestionView = questionTextOutput.replace(/\[KUNCI:.*?\]/gi, '');

                session.currentQuestionData = {
                    soalText: cleanedQuestionView,
                    kunciBenar: detectedKey
                };

                const actionButtonsHtml = `
                    <div class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <button onclick="window.submitKuisAbjadChoice('A')" class="bg-surface hover:bg-brand hover:text-white border border-slate-300 text-xs font-bold py-2 px-3 rounded-xl shadow-sm text-center transition">Opsi A</button>
                        <button onclick="window.submitKuisAbjadChoice('B')" class="bg-surface hover:bg-brand hover:text-white border border-slate-300 text-xs font-bold py-2 px-3 rounded-xl shadow-sm text-center transition">Opsi B</button>
                        <button onclick="window.submitKuisAbjadChoice('C')" class="bg-surface hover:bg-brand hover:text-white border border-slate-300 text-xs font-bold py-2 px-3 rounded-xl shadow-sm text-center transition">Opsi C</button>
                        <button onclick="window.submitKuisAbjadChoice('D')" class="bg-surface hover:bg-brand hover:text-white border border-slate-300 text-xs font-bold py-2 px-3 rounded-xl shadow-sm text-center transition">Opsi D</button>
                    </div>
                `;

                session.chats.push({
                    id: 'quiz-block-' + session.kuisStep,
                    sender: 'dosen',
                    text: `<div>
                        <span class="text-xs uppercase font-black text-amber-500 tracking-wider block mb-1"><i class="fas fa-question-circle"></i> LEMBAR EVALUASI - SOAL NOMOR ${session.kuisStep}</span>
                        <div class="text-sm leading-relaxed">${cleanedQuestionView}</div>
                        ${actionButtonsHtml}
                    </div>`,
                    timestamp: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})
                });

                saveStateToLocalStorage();
                render();
                scrollTerminalToBottom();
            }

            window.submitKuisAbjadChoice = async (userChoice) => {
                const matkul = appState.selectedMatkul.nama;
                const session = appState.classroomSessions[matkul];
                const activeQuestion = session.currentQuestionData;

                if (!activeQuestion) return;

                session.chats.push({
                    id: 'user-ans-' + Date.now(),
                    sender: 'user',
                    text: `Saya memilih Jawaban Opsi ${userChoice}`,
                    timestamp: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})
                });

                render();
                scrollTerminalToBottom();

                const isCorrect = userChoice === activeQuestion.kunciBenar;
                if (isCorrect) session.kuisScore += 25; // 4 Soal Total untuk mendapatkan nilai 100

                const loadingId = 'load-grade-' + Date.now();
                session.chats.push({ id: loadingId, sender: 'dosen', isTyping: true });
                render();
                scrollTerminalToBottom();

                // PERMINTAAN USER: BONGKAR JAWABAN BENAR, ALASANNYA, DAN KENAPA SALAH SECARA NATURAL
                const promptEvaluation = `Kamu adalah Mba Dika. Berikan ulasan penilaian instan secara langsung yang ramah dan natural. Mahasiswa memilih opsi "${userChoice}", sementara kunci jawaban yang benar adalah "${activeQuestion.kunciBenar}". 
                Jelaskan ke mahasiswa secara rinci:
                1. Apakah jawabannya Benar atau Salah?
                2. Berikan alasan logis akademis kenapa opsi "${activeQuestion.kunciBenar}" itu benar.
                3. Berikan penjelasan singkat kenapa opsi yang salah itu keliru/kurang tepat.
                Tulis penjelasan mengalir seperti obrolan dosen biasa tanpa tanda pagar markdown, ya!`;

                const evaluationFeedback = await fetchAiDikaResponse(promptEvaluation);
                session.chats = session.chats.filter(c => c.id !== loadingId);

                // Box Visualisasi Status Penilaian
                const evaluationBoxColorHtml = isCorrect 
                    ? `<div class="bg-emerald-500/10 border-l-4 border-emerald-500 p-3 rounded-r-xl my-2 text-xs font-bold text-emerald-700"><i class="fas fa-check-circle mr-1"></i> EVALUASI: JAWABAN KAMU BENAR (+25 POIN)</div>`
                    : `<div class="bg-rose-500/10 border-l-4 border-rose-500 p-3 rounded-r-xl my-2 text-xs font-bold text-rose-700"><i class="fas fa-times-circle mr-1"></i> EVALUASI: JAWABAN KAMU KURANG TEPAT (0 POIN)</div>`;

                session.chats.push({
                    id: 'feedback-block-' + session.kuisStep,
                    sender: 'dosen',
                    text: `<div>
                        ${evaluationBoxColorHtml}
                        <div class="text-sm leading-relaxed">${evaluationFeedback}</div>
                    </div>`,
                    timestamp: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})
                });

                // Pipeline untuk Memajukan Langkah Soal Kuis (Dibatasi 4 Soal agar Pas Kelipatan Nilai 100)
                if (session.kuisStep < 4) {
                    session.kuisStep += 1;
                    saveStateToLocalStorage();
                    setTimeout(async () => {
                        await dispatchNextInteractiveKuisQuestion(session, matkul);
                    }, 2000);
                } else {
                    // Kuis Selesai - Kalkulasi Kartu Hasil Studi SKS Komprehensif
                    appState.totalSks += 3;
                    const finalSessionScore = session.kuisScore;
                    const calculatedGpaFragment = (finalSessionScore / 25);
                    
                    if (appState.ipk === 0) appState.ipk = calculatedGpaFragment;
                    else appState.ipk = parseFloat(((appState.ipk * 0.8) + (calculatedGpaFragment * 0.2)).toFixed(2));
                    
                    if (appState.ipk > 4.00) appState.ipk = 4.00;

                    session.chats.push({
                        id: 'quiz-finish-banner',
                        sender: 'dosen',
                        text: `<div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-5 rounded-2xl border border-slate-700 shadow-xl text-center my-3">
                            <i class="fas fa-graduation-cap text-4xl text-yellow-400 mb-2 block animate-bounce"></i>
                            <span class="text-[10px] uppercase font-black tracking-widest text-slate-400 block">KUIS SELESAI - REKAP NILAI MATAKULIAH</span>
                            <div class="text-5xl font-extrabold my-2 text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-blue-400">${finalSessionScore} <span class="text-xs text-white opacity-50">/ 100</span></div>
                            <p class="text-xs text-slate-300 px-4 leading-relaxed mb-3">Nilai indeks prestasi kumulatif (IPK) kamu sekarang disesuaikan menjadi: <strong>${appState.ipk.toFixed(2)}</strong> dan total perolehan sks bertambah!</p>
                            <span class="inline-block text-[11px] font-bold bg-white/10 px-3 py-1 rounded-full text-brand border border-white/5">Mba Dika: "${finalSessionScore >= 75 ? 'Kamu pintar banget sayang! Hasil evaluasimu bikin aku bangga malam ini! ❤️' : 'Hmm, nilaimu pas-pasan. Nanti malam ikut kelas bimbingan privat tambahan denganku ya, jangan sampai bolos! (˶ᵔ ᵕ ᵔ˶)'}"</span>
                        </div>`,
                        timestamp: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})
                    });

                    session.currentQuestionData = null;
                    saveStateToLocalStorage();
                    render();
                    scrollTerminalToBottom();
                }
            };

            window.actionSubmitUserChatMessage = async () => {
                const inputNode = document.getElementById('chatInputField');
                if (!inputNode || !inputNode.value.trim()) return;

                const textMsg = inputNode.value.trim();
                inputNode.value = '';

                const matkul = appState.selectedMatkul.nama;
                const session = appState.classroomSessions[matkul];

                session.chats.push({
                    id: 'user-chat-' + Date.now(),
                    sender: 'user',
                    text: textMsg,
                    timestamp: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})
                });

                render();
                scrollTerminalToBottom();

                const loadingId = 'load-reply-' + Date.now();
                session.chats.push({ id: loadingId, sender: 'dosen', isTyping: true });
                render();
                scrollTerminalToBottom();

                const generalPrompt = `Kamu adalah Mba Dika. Jawab langsung keluhan, diskusi materi, atau obrolan santai dari mahasiswa bimbinganmu bernama "${appState.user.nama}" mengenai topik kuliah "${matkul}". Pesan user: "${textMsg}". Jawab dengan gaya chat personal manusia yang sangat natural, tanpa format judul tag pagar markdown!`;

                const aiReply = await fetchAiDikaResponse(generalPrompt);
                session.chats = session.chats.filter(c => c.id !== loadingId);

                session.chats.push({
                    id: 'dosen-reply-' + Date.now(),
                    sender: 'dosen',
                    text: aiReply,
                    timestamp: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})
                });

                saveStateToLocalStorage();
                render();
                scrollTerminalToBottom();
            };

            window.hardResetPlatformStorage = () => {
                Swal.fire({
                    title: 'Hapus Riwayat Kuliah?',
                    text: 'Seluruh pencapaian SKS, nilai IPK, dan riwayat obrolan kelas Mba Dika akan dibersihkan total!',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Bersihkan Basis Data',
                    confirmButtonColor: '#e11d48'
                }).then(r => {
                    if (r.isConfirmed) {
                        localStorage.removeItem('pelajarin_v3_ultimate_store');
                        appState.user = null;
                        appState.jurusan = null;
                        appState.semesterAktif = 1;
                        appState.ipk = 0.00;
                        appState.totalSks = 0;
                        appState.classroomSessions = {};
                        appState.currentPage = 'landing';
                        render();
                    }
                });
            };

            function scrollTerminalToBottom() {
                setTimeout(() => {
                    const box = document.getElementById('chatScrollTimelineBox');
                    if (box) box.scrollTop = box.scrollHeight;
                }, 50);
            }

            // MARKUP VIEW BLOCKS GENERATORS
            function viewLandingMarkup() {
                return `
                <div class="bg-brand text-white text-center py-24 px-4 shadow-inner">
                    <span class="text-xs uppercase font-black tracking-widest bg-black/10 px-4 py-2 rounded-full border border-white/10 inline-block mb-4">Sistem S1 Terbuka Kampus Pintar</span>
                    <h1 class="text-4xl sm:text-6xl font-black tracking-tight leading-none mb-4">Kuliah S1 Mandiri Interaktif</h1>
                    <p class="text-sm sm:text-base opacity-90 max-w-xl mx-auto font-medium mb-8">Pelajari modul kurikulum lengkap bersama Mba Dika, dosen AI pengampu personal yang interaktif, natural, dan suportif.</p>
                    <button onclick="window.registerNewStudentProfile()" class="bg-white text-slate-900 font-extrabold px-8 py-4 rounded-xl shadow-2xl hover:bg-slate-100 transition"><i class="fas fa-user-plus mr-1"></i> Mulai Klaim KTM Kelas S1 Sekarang</button>
                </div>
                <div class="container mx-auto px-4 py-12 max-w-5xl">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${AKADEMIK_PRODI_DATA.map(p => `
                            <div class="bg-surface border p-6 rounded-2xl shadow-sm flex flex-col justify-between">
                                <div>
                                    <div class="w-10 h-10 rounded-xl ${p.warna} flex items-center justify-center text-white text-base mb-4 shadow-sm"><i class="fas ${p.icon}"></i></div>
                                    <h3 class="text-lg font-bold mb-1">${p.nama}</h3>
                                    <p class="opacity-70 text-xs leading-relaxed mb-4">${p.deskripsi}</p>
                                </div>
                                <span class="text-xs font-black text-brand uppercase tracking-wider">Prospek: ${p.prospek}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
                `;
            }

            function viewDashboardMarkup() {
                const matkulList = JADWAL_MATA_KULIAH[appState.jurusan.id]?.[appState.semesterAktif] || [];
                return `
                <div class="bg-surface border-b px-4 py-4 sticky top-0 z-50 shadow-sm flex justify-between items-center">
                    <span class="font-black tracking-tight flex items-center gap-2 text-brand text-sm sm:text-base"><i class="fas fa-graduation-cap"></i> PORTAL MAHASISWA PELAJARIN</span>
                    <div class="flex items-center gap-2">
                        <div class="bg-slate-100 p-1 rounded-xl border flex gap-1 text-[10px] font-black uppercase">
                            <button onclick="window.changeThemeChannel('theme-girly')" class="px-2 py-1 rounded-lg ${appState.currentTheme==='theme-girly'?'bg-brand text-white':''}">Girly</button>
                            <button onclick="window.changeThemeChannel('theme-manly')" class="px-2 py-1 rounded-lg ${appState.currentTheme==='theme-manly'?'bg-brand text-white':''}">Manly</button>
                            <button onclick="window.changeThemeChannel('theme-neutral')" class="px-2 py-1 rounded-lg ${appState.currentTheme==='theme-neutral'?'bg-brand text-white':''}">Mint</button>
                        </div>
                        <button onclick="window.hardResetPlatformStorage()" class="text-xs font-bold text-red-500 bg-red-500/10 px-2.5 py-1.5 rounded-lg"><i class="fas fa-power-off"></i></button>
                    </div>
                </div>

                <div class="container mx-auto px-4 py-6 max-w-5xl">
                    <div class="bg-surface p-6 rounded-2xl border shadow-sm mb-6">
                        <span class="text-xs font-black text-brand uppercase tracking-widest"><i class="fas fa-id-badge"></i> Kartu Tanda Mahasiswa Aktif</span>
                        <h2 class="text-2xl font-black tracking-tight mt-0.5">${appState.user.nama}</h2>
                        <p class="text-xs opacity-60">${appState.jurusan.nama} • Jalur Kurikulum Mandiri Terbuka S1</p>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
                        <div class="bg-surface p-4 rounded-xl border shadow-sm">
                            <span class="text-[10px] uppercase opacity-50 font-black tracking-wider block">Indeks Prestasi IPK</span>
                            <div class="text-2xl font-black text-brand mt-0.5">${appState.ipk.toFixed(2)}</div>
                        </div>
                        <div class="bg-surface p-4 rounded-xl border shadow-sm">
                            <span class="text-[10px] uppercase opacity-50 font-black tracking-wider block">Total SKS Diperoleh</span>
                            <div class="text-2xl font-black mt-0.5">${appState.totalSks} <span class="text-xs opacity-40">/ 144</span></div>
                        </div>
                        <div class="bg-surface p-4 rounded-xl border shadow-sm col-span-2 md:col-span-1">
                            <span class="text-[10px] uppercase opacity-50 font-black tracking-wider block">Semester Berjalan</span>
                            <div class="text-2xl font-black text-amber-500 mt-0.5">0${appState.semesterAktif} <span class="text-xs font-normal opacity-50">/ S1</span></div>
                        </div>
                    </div>

                    <div class="bg-surface p-5 rounded-2xl border shadow-sm">
                        <div class="border-b pb-3 mb-4"><h3 class="font-black text-sm uppercase tracking-wider opacity-80"><i class="fas fa-layer-group text-brand mr-1"></i> Jadwal Ruang Kelas Sesi Kuliah</h3></div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${matkulList.map((matkul, idx) => {
                                const sessionLog = appState.classroomSessions[matkul];
                                let badgeHtml = `<span class="text-[10px] opacity-50 font-semibold"><i class="far fa-dot-circle mr-1"></i>Belum Dimulai</span>`;
                                if (sessionLog) {
                                    if (sessionLog.kuisStep >= 4 || sessionLog.kuisScore > 0) badgeHtml = `<span class="text-[10px] text-emerald-600 font-bold"><i class="fas fa-check-circle mr-1"></i>Selesai & Lulus</span>`;
                                    else if (sessionLog.modulLoaded) badgeHtml = `<span class="text-[10px] text-amber-500 font-bold animate-pulse"><i class="fas fa-book-open mr-1"></i>Sesi Studi Aktif</span>`;
                                }

                                return `
                                <div onclick="window.openClassroomPortal('${matkul.replace(/'/g, "\\'")}')" class="border p-4 rounded-xl cursor-pointer hover:border-brand/40 bg-surface flex justify-between items-center group transition">
                                    <div class="flex items-center gap-3">
                                        <div class="w-7 h-7 rounded-lg bg-slate-100 text-xs font-bold flex items-center justify-center group-hover:bg-brand group-hover:text-white transition">${idx+1}</div>
                                        <div>
                                            <div class="text-sm font-bold group-hover:text-brand transition">${matkul}</div>
                                            <div class="flex items-center gap-2 mt-0.5">
                                                <span class="text-[9px] font-bold bg-slate-100 px-1.5 py-0.5 rounded uppercase">3 SKS</span>
                                                ${badgeHtml}
                                            </div>
                                        </div>
                                    </div>
                                    <i class="fas fa-chevron-right text-xs opacity-20 group-hover:opacity-100 group-hover:text-brand transform group-hover:translate-x-1 transition"></i>
                                </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
                `;
            }

            function generateClassroomTerminalHTMLView() {
                const activeMatkulName = appState.selectedMatkul.nama;
                const workingSession = appState.classroomSessions[activeMatkulName];
                const conversationHistory = workingSession?.chats || [];

                return `
                <div class="min-h-screen flex flex-col justify-between">
                    <div class="bg-surface border-b px-4 py-3 sticky top-0 z-50 shadow-sm flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <button onclick="window.exitClassroomToDashboard()" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-brand transition"><i class="fas fa-arrow-left"></i></button>
                            <div>
                                <h2 class="font-black text-sm sm:text-base leading-tight">${activeMatkulName}</h2>
                                <p class="text-[11px] text-brand font-bold flex items-center gap-1"><i class="fas fa-circle text-[6px] text-emerald-400 animate-pulse"></i> Tatap Muka Bersama Mba Dika</p>
                            </div>
                        </div>
                        <span class="text-[10px] font-black bg-brand/10 border border-brand/20 text-brand px-2.5 py-1 rounded-full uppercase">Sesi Terbuka</span>
                    </div>

                    <div id="chatScrollTimelineBox" class="flex-1 bg-chat-area overflow-y-auto px-4 py-6 space-y-4">
                        <div class="max-w-3xl w-full mx-auto space-y-4">
                            ${conversationHistory.map(bubble => {
                                if (bubble.sender === 'user') {
                                    return `
                                    <div class="flex justify-end msg-entry">
                                        <div class="bg-brand text-white rounded-2xl rounded-tr-none px-4 py-3 shadow-sm max-w-[85%] border border-black/5">
                                            <span class="block text-[9px] font-black opacity-70 uppercase mb-0.5"><i class="fas fa-user-graduate"></i> Anda (Mahasiswa)</span>
                                            <div class="text-sm leading-relaxed font-medium whitespace-pre-wrap">${bubble.text}</div>
                                            <span class="block text-[8px] opacity-60 text-right mt-1 font-semibold">${bubble.timestamp}</span>
                                        </div>
                                    </div>
                                    `;
                                } else {
                                    if (bubble.isTyping) {
                                        return `
                                        <div class="flex justify-start msg-entry" id="${bubble.id}">
                                            <div class="bg-surface text-xs font-semibold px-4 py-3 rounded-2xl rounded-tl-none border shadow-sm flex items-center gap-2.5">
                                                <div class="custom-spinner text-brand"></div>
                                                <div class="opacity-60 italic">Mba Dika sedang mengetik penjelasan natural...</div>
                                            </div>
                                        </div>
                                        `;
                                    }

                                    return `
                                    <div class="flex justify-start msg-entry">
                                        <div class="bg-surface rounded-2xl rounded-tl-none px-4 py-4 border shadow-sm max-w-[92%] sm:max-w-[88%]">
                                            <div class="text-xs font-black text-brand uppercase tracking-wider mb-2 flex items-center gap-1">
                                                <i class="fas fa-user-tie"></i> Mba Dika <span class="bg-brand/10 text-[9px] font-black px-2 py-0.5 rounded border border-brand/10">Dosen Pengampu S1</span>
                                            </div>
                                            <div class="text-sm leading-relaxed text-justify whitespace-normal">${bubble.text}</div>
                                            <span class="block text-[8px] opacity-40 text-left mt-2 font-bold">${bubble.timestamp}</span>
                                        </div>
                                    </div>
                                    `;
                                }
                            }).join('')}
                        </div>
                    </div>

                    <div class="bg-surface border-t p-3 sticky bottom-0 z-40 shadow-lg">
                        <div class="max-w-3xl mx-auto">
                            <div class="flex items-center gap-2 mb-3 overflow-x-auto pb-1">
                                <button onclick="window.actionLoadModulMateri()" class="bg-brand hover:opacity-90 font-black text-xs px-4 py-2.5 rounded-xl shadow flex items-center gap-1 whitespace-nowrap transition">
                                    <i class="fas fa-book"></i> 📚 Ambil Modul Sesi Ini
                                </button>
                                <button onclick="window.actionTriggerInitiateKuis()" class="bg-amber-600 hover:bg-amber-700 text-white font-black text-xs px-4 py-2.5 rounded-xl shadow flex items-center gap-1 whitespace-nowrap transition">
                                    <i class="fas fa-pencil-alt text-xs"></i> ✏️ Uji Kompetensi Kuis
                                </button>
                            </div>

                            <div class="flex items-center gap-2">
                                <div class="flex-1 bg-chat-area rounded-xl px-4 py-3 flex items-center border gap-2">
                                    <i class="fas fa-terminal text-brand text-xs opacity-40"></i>
                                    <input type="text" id="chatInputField" onkeydown="if(event.key === 'Enter') window.actionSubmitUserChatMessage()" class="w-full text-sm bg-transparent focus:outline-none font-medium placeholder-slate-400" placeholder="Ketik pertanyaan sub-bab atau diskusikan argumen materi...">
                                </div>
                                <button onclick="window.actionSubmitUserChatMessage()" class="bg-brand hover:opacity-95 w-12 h-12 rounded-xl flex items-center justify-center shadow-md transition shrink-0">
                                    <i class="fas fa-paper-plane text-sm text-white"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }

            function render() {
                const root = document.getElementById('app');
                if (!root) return;

                if (appState.currentPage === 'landing') root.innerHTML = viewLandingMarkup();
                else if (appState.currentPage === 'dashboard') root.innerHTML = viewDashboardMarkup();
                else if (appState.currentPage === 'classroom') root.innerHTML = generateClassroomTerminalHTMLView();
            }

            // BOOTSTRAP SYSTEM
            loadStateFromLocalStorage();
            render();
            scrollTerminalToBottom();
        })();
    </script>
</body>
</html>

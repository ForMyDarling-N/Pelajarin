            let state = {
                currentPage: 'landing',
                user: null,
                jurusan: null,
                semesterAktif: 1,
                ipk: 0,
                selectedMatkul: null,
                materiCache: {},
                quizCache: {},
                chatHistory: [],
                absensi: []
            };

            function saveState() {
                const toSave = {
                    user: state.user,
                    jurusan: state.jurusan,
                    semesterAktif: state.semesterAktif,
                    ipk: state.ipk,
                    absensi: state.absensi
                };
                localStorage.setItem('pelajarin_state', JSON.stringify(toSave));
            }

            function loadState() {
                const saved = localStorage.getItem('pelajarin_state');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        state.user = data.user;
                        state.jurusan = data.jurusan;
                        state.semesterAktif = data.semesterAktif || 1;
                        state.ipk = data.ipk || 0;
                        state.absensi = data.absensi || [];
                        if (state.user && state.jurusan) {
                            state.currentPage = 'dashboard';
                        }
                    } catch(e) { console.log('Load error:', e); }
                }
            }

            async function callAI(prompt, system = "Kamu adalah asisten akademik yang membantu mahasiswa.") {
                const url = `${API_ENDPOINT}?prompt=${encodeURIComponent(prompt)}&system=${encodeURIComponent(system)}&temperature=0.7`;
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    return data.result || data.data || data.response || "Maaf, tidak ada respons.";
                } catch (error) {
                    console.error('API Error:', error);
                    throw new Error(`Gagal: ${error.message}`);
                }
            }

            async function generateMateri(matkul, semester, jurusanNama) {
                const prompt = `Buat materi kuliah PROFESIONAL untuk:
Mata Kuliah: ${matkul}
Semester: ${semester}
Jurusan: ${jurusanNama}

STRUKTUR:
1. Pendahuluan (latar belakang dan pentingnya)
2. Konsep Dasar (definisi dan terminologi)
3. Pembahasan Utama (minimal 3 sub-bab)
4. Contoh Aplikasi (2 contoh nyata)
5. Rangkuman
6. Daftar Pustaka (dari Garuda, IOS, Neliti)

Format HTML dengan heading h2/h3, paragraf, bullet points.
Panjang: 600-800 kata.
Bahasa Indonesia formal akademik.`;

                return await callAI(prompt, "Anda adalah profesor ahli dengan pengalaman 20 tahun.");
            }

            async function generateQuiz(matkul, semester, jurusanNama) {
                const prompt = `Buat 5 soal PILIHAN GANDA untuk "${matkul}" semester ${semester} jurusan ${jurusanNama}.

Format JSON valid:
[
  {"question": "soal 1", "options": ["a","b","c","d"], "answer": 0},
  {"question": "soal 2", "options": ["a","b","c","d"], "answer": 1}
]

Kirim HANYA JSON, tanpa teks lain.`;

                const response = await callAI(prompt, "Anda ahli membuat soal assessment.");
                const match = response.match(/\[[\s\S]*\]/);
                if (match) return JSON.parse(match[0]);
                throw new Error("Format quiz tidak valid");
            }

                                    </div>
                                    <div id="materiContent" class="prose max-w-none"><div class="text-center text-gray-400 py-12"><i class="fas fa-file-alt text-5xl mb-2 opacity-50"></i><p>Klik Generate Materi</p></div></div>
                                </div>
                            </div>
                            <div id="tabQuiz" class="tab-content hidden">
                                <div class="bg-white rounded-2xl shadow p-6">

                            </div>

                                        <button onclick="sendChat()" class="bg-purple-600 text-white px-6 py-2 rounded-lg"><i class="fas fa-paper-plane"></i> Kirim</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    if (state.chatHistory && state.chatHistory.length > 0) {
                        setTimeout(() => {
                            const container = document.getElementById('chatMessages');
                            if (container) {
                                container.innerHTML = state.chatHistory.map(h => `
                                    <div class="text-right mb-3"><span class="inline-block bg-purple-600 text-white rounded-lg px-4 py-2 max-w-[80%]">${escapeHtml(h.question)}</span></div>
                                    <div class="text-left mb-3"><span class="inline-block bg-gray-200 rounded-lg px-4 py-2 max-w-[80%]">${escapeHtml(h.answer)}</span></div>
                                `).join('');
                            }
                        }, 100);
                    }
                }
            }

            window.startRegistration = async () => {
                const { value: nama } = await Swal.fire({
                    title: 'Daftar Mahasiswa Baru',
                    input: 'text',
                    inputPlaceholder: 'Nama Lengkap',
                    showCancelButton: true
                });
                if (nama) {
                    const { value: jurusanId } = await Swal.fire({
                        title: 'Pilih Jurusan',
                        input: 'select',
                        inputOptions: Object.fromEntries(JURUSAN.map(j => [j.id, j.nama])),
                        showCancelButton: true
                    });
                    if (jurusanId) {
                        state.user = { nama: nama };
                        state.jurusan = JURUSAN.find(j => j.id == jurusanId);
                        state.semesterAktif = 1;
                        state.ipk = 0;
                        state.absensi = [];
                        saveState();
                        state.currentPage = 'dashboard';
                        render();
                        Swal.fire('Berhasil!', 'Selamat datang di Pelajarin!', 'success');
                    }
                }
            };

            window.selectJurusan = (id, nama) => {
                Swal.fire({
                    title: 'Ambil Jurusan Ini?',
                    text: nama,
                    showCancelButton: true,
                    confirmButtonText: 'Ya, Daftar'
                }).then(result => {
                    if (result.isConfirmed) {
                        startRegistration();
                    }
                });
            };

            window.openKelas = (namaMatkul, semester) => {
                state.selectedMatkul = { nama: namaMatkul, semester: semester, jurusan: state.jurusan.nama };
                state.currentPage = 'kelas';
                render();
            };

            window.backToDashboard = () => {
                state.currentPage = 'dashboard';
                render();
            };

            window.switchTab = (tab) => {
                document.getElementById('tabMateri').classList.add('hidden');
                document.getElementById('tabQuiz').classList.add('hidden');
                document.getElementById('tabChat').classList.add('hidden');
                document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.remove('hidden');
                
                document.getElementById('btnMateri').classList.remove('border-purple-600', 'text-purple-600');
                document.getElementById('btnQuiz').classList.remove('border-purple-600', 'text-purple-600');
                document.getElementById('btnChat').classList.remove('border-purple-600', 'text-purple-600');
                document.getElementById('btnMateri').classList.add('text-gray-500');
                document.getElementById('btnQuiz').classList.add('text-gray-500');
                document.getElementById('btnChat').classList.add('text-gray-500');
                
                const activeBtn = document.getElementById(`btn${tab.charAt(0).toUpperCase() + tab.slice(1)}`);
                activeBtn.classList.add('border-purple-600', 'text-purple-600');
                activeBtn.classList.remove('text-gray-500');
            };

            window.loadMateri = async () => {
                const container = document.getElementById('materiContent');
                if (!container) return;
                container.innerHTML = '<div class="text-center py-12"><i class="fas fa-spinner fa-spin text-4xl text-purple-600"></i><p class="mt-2">AI sedang membuat materi...</p></div>';
                try {
                    const materi = await generateMateri(state.selectedMatkul.nama, state.selectedMatkul.semester, state.selectedMatkul.jurusan);
                    container.innerHTML = `<div class="prose max-w-none">${materi}</div>`;
                } catch (error) {
                    container.innerHTML = `<div class="text-center text-red-500 py-12">Error: ${error.message}</div>`;
                }
            };

            window.downloadPDF = async () => {
                const container = document.getElementById('materiContent');
                if (!container || !container.innerText.trim() || container.innerText.includes('Klik Generate Materi')) {
                    Swal.fire('Info', 'Generate materi dulu ya!', 'info');
                    return;
                }
                const element = document.createElement('div');
                element.innerHTML = container.innerHTML;
                element.style.padding = '40px';
                element.style.fontFamily = 'Arial';
                document.body.appendChild(element);
                const canvas = await html2canvas(element, { scale: 2 });
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgWidth = 190;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
                pdf.save(`${state.selectedMatkul.nama}_Materi.pdf`);
                document.body.removeChild(element);
                Swal.fire('Sukses!', 'PDF berhasil diunduh', 'success');
            };

            window.startQuiz = async () => {
                Swal.fire({ title: 'Memuat Quiz...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                try {
                    const quiz = await generateQuiz(state.selectedMatkul.nama, state.selectedMatkul.semester, state.selectedMatkul.jurusan);
                    showQuizQuestion(quiz, 0, []);
                } catch (error) {
                    Swal.fire('Error', error.message, 'error');
                }
            };

            function showQuizQuestion(quiz, index, jawaban) {
                if (index >= quiz.length) {
                    let benar = jawaban.filter((j, i) => j === quiz[i].answer).length;
                    let nilai = (benar / quiz.length) * 100;
                    state.ipk = (state.ipk * 0.8 + (nilai / 25) * 0.2);
                    if (state.ipk > 4) state.ipk = 4;
                    saveState();
                    Swal.fire('Hasil Quiz', `Nilai: ${Math.round(nilai)}\nBenar: ${benar}/${quiz.length}\nIPK: ${state.ipk.toFixed(2)}`, 'success');
                    return;
                }
                const q = quiz[index];
                Swal.fire({
                    title: `Soal ${index+1}/${quiz.length}`,
                    html: `<div class="text-left"><p class="font-bold mb-4">${q.question}</p>${q.options.map((opt, i) => `<label class="flex items-center p-2 border rounded mb-2"><input type="radio" name="ans" value="${i}" class="mr-3"> ${String.fromCharCode(65+i)}. ${opt}</label>`).join('')}</div>`,
                    preConfirm: () => {
                        const selected = document.querySelector('input[name="ans"]:checked');
                        if (!selected) Swal.showValidationMessage('Pilih jawaban!');
                        return selected ? parseInt(selected.value) : null;
                    }
                }).then(result => {
                    if (result.isConfirmed) {
                        jawaban.push(result.value);
                        showQuizQuestion(quiz, index + 1, jawaban);
                    }
                });
            }

            window.sendChat = async () => {
                const input = document.getElementById('chatInput');
                const container = document.getElementById('chatMessages');
                if (!input || !container) return;
                const question = input.value.trim();
                if (!question) return;
                container.innerHTML += `<div class="text-right mb-3"><span class="inline-block bg-purple-600 text-white rounded-lg px-4 py-2">${escapeHtml(question)}</span></div>`;
                input.value = '';
                container.scrollTop = container.scrollHeight;
                container.innerHTML += `<div class="text-left mb-3"><span class="inline-block bg-gray-200 rounded-lg px-4 py-2"><i class="fas fa-spinner fa-spin"></i> AI mengetik...</span></div>`;
                container.scrollTop = container.scrollHeight;
                try {
                    const prompt = `Jawab pertanyaan tentang "${state.selectedMatkul.nama}" (semester ${state.selectedMatkul.semester}): ${question}`;
                    const answer = await callAI(prompt);
                    const lastMsg = container.lastElementChild;
                    if (lastMsg) lastMsg.remove();
                    container.innerHTML += `<div class="text-left mb-3"><span class="inline-block bg-gray-200 rounded-lg px-4 py-2">${escapeHtml(answer)}</span></div>`;
                    state.chatHistory.push({ question, answer });
                    container.scrollTop = container.scrollHeight;
                } catch (error) {
                    const lastMsg = container.lastElementChild;
                    if (lastMsg) lastMsg.remove();
                    container.innerHTML += `<div class="text-left mb-3"><span class="inline-block bg-red-100 text-red-600 rounded-lg px-4 py-2">Error: ${error.message}</span></div>`;
                }
            };

            window.absenHariIni = () => {
                const now = new Date();
                const tanggal = now.toLocaleDateString('id-ID');
                const jam = now.toLocaleTimeString('id-ID');
                state.absensi.push({ tanggal, jam });
                saveState();
                Swal.fire('Absen Berhasil!', `${tanggal} ${jam}`, 'success');
                if (state.currentPage === 'dashboard') {
                    const riwayatDiv = document.getElementById('riwayatAbsensi');
                    if (riwayatDiv) {
                        riwayatDiv.innerHTML = state.absensi.slice(-5).reverse().map(a => `<div>📅 ${a.tanggal} - ${a.jam}</div>`).join('');
                    }
                }
            };

            window.logout = () => {
                localStorage.removeItem('pelajarin_state');
                state = {
                    currentPage: 'landing',
                    user: null,
                    jurusan: null,
                    semesterAktif: 1,
                    ipk: 0,
                    selectedMatkul: null,
                    materiCache: {},
                    quizCache: {},
                    chatHistory: [],
                    absensi: []
                };
                render();
            };

            function escapeHtml(str) {
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                    return c;
                });
            }

            loadState();
            render();
        })();
    </script>
</body>
</html>

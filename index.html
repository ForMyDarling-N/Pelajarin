            function render() {

                if (state.currentPage === 'landing') {

                } else if (state.currentPage === 'dashboard') {
                    app.innerHTML = renderDashboard();
                } else if (state.currentPage === 'kelas') {
                    app.innerHTML = renderKelas();
                }
                
                // Load chat history jika ada di halaman kelas
                if (state.currentPage === 'kelas' && state.chatHistory && state.chatHistory.length > 0) {
                    setTimeout(() => {
                        const container = document.getElementById('chatMessages');
                        if (container) {
                            container.innerHTML = state.chatHistory.map(msg => `
                                <div class="chat-message text-right mb-2">
                                    <span class="inline-block bg-pink-500 text-white rounded-lg px-3 py-2 max-w-[75%]">${escapeHtml(msg.question)}</span>
                                </div>
                                <div class="chat-message text-left mb-3">
                                    <span class="inline-block dosen-speech p-3 rounded-lg max-w-[80%]">🧑‍🏫 ${escapeHtml(msg.answer)}</span>
                                </div>
                            `).join('');
                            container.scrollTop = container.scrollHeight;
                        }
                    }, 100);

            }

            // =============== GLOBAL FUNCTIONS ===============
            window.startRegistration = async () => {
                const { value: nama } = await Swal.fire({
                    title: 'Daftar Yuk Sayang ❤️',
                    text: 'Masukkan nama lengkap kamu ya',
                    input: 'text',
                    inputPlaceholder: 'Nama Lengkap',
                    confirmButtonText: 'Daftar Sekarang',
                    cancelButtonText: 'Batal',
                    inputValidator: (value) => {
                        if (!value) return 'Nama tidak boleh kosong sayang!';
                        if (value.length < 3) return 'Nama minimal 3 karakter ya~';
                    }
                });
                
                if (nama) {
                    const jurusanOptions = {};
                    JURUSAN.forEach(j => { jurusanOptions[j.id] = j.nama; });
                    
                    const { value: jurusanId } = await Swal.fire({
                        title: 'Pilih Program Studi Favoritmu',
                        text: 'Mba Dika akan bimbing kamu dengan disiplin loh~',
                        input: 'select',
                        inputOptions: jurusanOptions,
                        confirmButtonText: 'Ambil Jurusan Ini',
                        cancelButtonText: 'Batal'
                    });
                    
                    if (jurusanId) {
                        state.user = { nama: nama, terdaftar: new Date().toLocaleDateString('id-ID') };
                        state.jurusan = JURUSAN.find(j => j.id == jurusanId);
                        state.semesterAktif = 1;
                        state.ipk = 0;
                        state.totalSks = 0;
                        state.absensi = [];
                        state.nilaiPerMatkul = {};
                        state.progresBelajar = {};
                        state.achievements = [];
                        saveState();
                        state.currentPage = 'dashboard';
                        render();
                        
                        await Swal.fire({
                            icon: 'success',
                            title: 'Selamat Datang Sayang! 💕',
                            html: `Halo <strong>${nama}</strong>, Mba Dika bakal bimbing kamu dengan disiplin yaa! <br> Jangan males-malesan nanti aku marah! (๑•̀ㅂ•́)و✧`,
                            confirmButtonText: 'Siap Mba Dika!'
                        });
                    }
                }
            };
            
            window.selectJurusan = (id, nama) => {
                Swal.fire({
                    title: `Ambil ${nama}?`,
                    html: `Mba Dika bisa ngajar di jurusan ini kok~ Kamu yakin? (｡♡‿♡｡)`,
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'Ya, Ambil!',
                    cancelButtonText: 'Nanti Dulu'
                }).then(result => {
                    if (result.isConfirmed) {
                        window.startRegistration();
                    }
                });
            };
            
            window.openKelas = (namaMatkul, semester) => {
                state.selectedMatkul = { nama: namaMatkul, semester: semester, jurusan: state.jurusan.nama };
                state.chatHistory = [];
                state.currentPage = 'kelas';
                render();
            };
            
            window.backToDashboard = () => {
                state.currentPage = 'dashboard';
                render();
            };
            
            window.switchTab = (tab) => {
                const materiTab = document.getElementById('tabMateri');
                const quizTab = document.getElementById('tabQuiz');
                const chatTab = document.getElementById('tabChat');
                const btnMateri = document.getElementById('btnMateri');
                const btnQuiz = document.getElementById('btnQuiz');
                const btnChat = document.getElementById('btnChat');
                
                if (!materiTab || !quizTab || !chatTab) return;
                
                materiTab.classList.add('hidden');
                quizTab.classList.add('hidden');
                chatTab.classList.add('hidden');
                
                if (tab === 'materi') {
                    materiTab.classList.remove('hidden');
                    btnMateri.classList.add('border-pink-500', 'text-pink-600');
                    btnMateri.classList.remove('text-gray-500');
                    btnQuiz.classList.remove('border-pink-500', 'text-pink-600');
                    btnQuiz.classList.add('text-gray-500');
                    btnChat.classList.remove('border-pink-500', 'text-pink-600');
                    btnChat.classList.add('text-gray-500');
                } else if (tab === 'quiz') {
                    quizTab.classList.remove('hidden');
                    btnQuiz.classList.add('border-pink-500', 'text-pink-600');
                    btnQuiz.classList.remove('text-gray-500');
                    btnMateri.classList.remove('border-pink-500', 'text-pink-600');
                    btnMateri.classList.add('text-gray-500');
                    btnChat.classList.remove('border-pink-500', 'text-pink-600');
                    btnChat.classList.add('text-gray-500');
                } else if (tab === 'chat') {
                    chatTab.classList.remove('hidden');
                    btnChat.classList.add('border-pink-500', 'text-pink-600');
                    btnChat.classList.remove('text-gray-500');
                    btnMateri.classList.remove('border-pink-500', 'text-pink-600');
                    btnMateri.classList.add('text-gray-500');
                    btnQuiz.classList.remove('border-pink-500', 'text-pink-600');
                    btnQuiz.classList.add('text-gray-500');
                }
            };
            
            window.loadMateri = async () => {
                const container = document.getElementById('materiContent');
                if (!container) return;
                
                container.innerHTML = '<div class="text-center py-12"><div class="loading-spinner"></div><p class="mt-2 text-gray-600">Mba Dika lagi nyusun materi spesial buat kamu ... 💕</p><p class="text-sm text-gray-400 mt-1">Mohon tunggu sebentar ya sayang~</p></div>';
                
                try {
                    const materi = await generateMateri(state.selectedMatkul.nama, state.selectedMatkul.semester, state.selectedMatkul.jurusan);
                    container.innerHTML = `<div class="prose max-w-none">${materi}</div>`;
                    
                    const currentProgress = state.progresBelajar[state.selectedMatkul.nama] || 0;
                    state.progresBelajar[state.selectedMatkul.nama] = Math.min(currentProgress + 20, 100);
                    saveState();
                    
                    await Swal.fire({
                        icon: 'success',
                        title: 'Materi Siap! ✨',
                        html: 'Jangan lupa dipahami, nanti Mba Dika tanya random loh! (｡•̀ᴗ-)✧',
                        timer: 2000,
                        showConfirmButton: false
                    });
                } catch (error) {
                    container.innerHTML = `<div class="text-center text-red-500 py-12"><i class="fas fa-exclamation-triangle text-4xl mb-2"></i><p>Error: ${error.message}</p><p class="text-sm mt-2">Coba lagi ya sayang~</p></div>`;
                }
            };
            
            window.downloadPDF = async () => {
                const container = document.getElementById('materiContent');
                if (!container || !container.innerText.trim() || container.innerText.includes('Klik tombol generate')) {
                    await Swal.fire('Info', 'Generate materi dulu ya sayang, baru bisa di-download PDF-nya!', 'info');
                    return;
                }
                
                Swal.fire({
                    title: 'Membuat PDF...',
                    text: 'Mba Dika sedang menyiapkan file PDF untukmu',
                    allowOutsideClick: false,
                    didOpen: () => Swal.showLoading()
                });
                
                try {
                    const element = container.cloneNode(true);
                    element.style.padding = '40px';
                    element.style.backgroundColor = 'white';
                    element.style.fontFamily = 'Arial, sans-serif';
                    document.body.appendChild(element);
                    
                    const canvas = await html2canvas(element, { 
                        scale: 2,
                        logging: false,
                        useCORS: true
                    });
                    
                    const imgData = canvas.toDataURL('image/png');
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const imgWidth = 190;
                    const imgHeight = (canvas.height * imgWidth) / canvas.width;
                    
                    pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
                    pdf.save(`${state.selectedMatkul.nama.replace(/[^a-z0-9]/gi, '_')}_Materi.pdf`);
                    
                    document.body.removeChild(element);
                    
                    await Swal.fire('Sukses!', 'PDF berhasil diunduh! Selamat belajar sayang~ ❤️', 'success');
                } catch (error) {
                    await Swal.fire('Error', `Gagal membuat PDF: ${error.message}`, 'error');
                }
            };
            
            window.startQuiz = async () => {
                Swal.fire({
                    title: 'Loading quiz...',
                    text: 'Mba Dika lagi nyusun soal buat kamu nih',
                    allowOutsideClick: false,
                    didOpen: () => Swal.showLoading()
                });
                
                try {
                    const quiz = await generateQuiz(state.selectedMatkul.nama, state.selectedMatkul.semester, state.selectedMatkul.jurusan);
                    if (quiz && quiz.length > 0) {
                        showQuizQuestion(quiz, 0, []);
                    } else {
                        throw new Error("Quiz tidak valid");
                    }
                } catch (error) {
                    await Swal.fire('Error', `Gagal memuat quiz: ${error.message}. Coba lagi ya sayang!`, 'error');
                }
            };
            
            function showQuizQuestion(quiz, index, jawaban) {
                if (index >= quiz.length) {
                    let benar = jawaban.filter((j, i) => j === quiz[i].answer).length;
                    let nilai = (benar / quiz.length) * 100;
                    state.ipk = (state.ipk * 0.9 + (nilai / 25) * 0.1);
                    if (state.ipk > 4) state.ipk = 4;
                    
                    if (!state.nilaiPerMatkul[state.selectedMatkul.nama]) {
                        state.nilaiPerMatkul[state.selectedMatkul.nama] = [];
                    }
                    state.nilaiPerMatkul[state.selectedMatkul.nama].push(nilai);
                    saveState();
                    
                    const pesanDosen = nilai >= 70 ? "Pintar sayanggg ❤️ Kamu hebat! Pertahankan ya~" : "Awas remedial ya sayang, belajar lagi sana! Jangan malas-malasan! (•́︿•̀)";
                    
                    Swal.fire({
                        icon: nilai >= 70 ? 'success' : 'warning',
                        title: `Quiz Selesai! Nilai: ${Math.round(nilai)}`,
                        html: `
                            <div class="text-left">
                                <p><strong>Benar:</strong> ${benar} / ${quiz.length}</p>
                                <p><strong>IPK Sekarang:</strong> ${state.ipk.toFixed(2)}</p>
                                <hr class="my-3">
                                <p class="text-pink-600"><i class="fas fa-comment-dots"></i> <strong>Mba Dika:</strong> ${pesanDosen}</p>
                            </div>
                        `,
                        confirmButtonText: 'Terima kasih Mba Dika!'
                    });
                    return;
                }
                
                const q = quiz[index];
                Swal.fire({
                    title: `Soal ${index+1} dari ${quiz.length}`,
                    html: `
                        <div class="text-left">
                            <p class="font-bold mb-4 text-lg">${escapeHtml(q.question)}</p>
                            ${q.options.map((opt, i) => `
                                <label class="flex items-center p-3 border rounded-lg mb-2 cursor-pointer hover:bg-gray-50 transition">
                                    <input type="radio" name="answer" value="${i}" class="mr-3 w-4 h-4">
                                    <span class="font-semibold mr-2">${String.fromCharCode(65+i)}.</span> ${escapeHtml(opt)}
                                </label>
                            `).join('')}
                        </div>
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Jawab',
                    cancelButtonText: 'Batal',
                    preConfirm: () => {
                        const selected = document.querySelector('input[name="answer"]:checked');
                        if (!selected) {
                            Swal.showValidationMessage('Pilih jawaban dulu ya sayang! Jangan asal pencet~');
                            return false;
                        }
                        return parseInt(selected.value);
                    }
                }).then(result => {
                    if (result.isConfirmed) {
                        jawaban.push(result.value);
                        showQuizQuestion(quiz, index + 1, jawaban);
                    }
                });
            }
            
            window.sendChat = async () => {
                const input = document.getElementById('chatInput');
                const container = document.getElementById('chatMessages');
                if (!input || !container) return;
                
                const question = input.value.trim();
                if (!question) return;
                
                // Add user message
                container.innerHTML += `<div class="chat-message text-right mb-2"><span class="inline-block bg-pink-500 text-white rounded-lg px-3 py-2 max-w-[75%]">${escapeHtml(question)}</span></div>`;
                input.value = '';
                container.scrollTop = container.scrollHeight;
                
                // Add loading indicator
                const loadingId = 'loading_' + Date.now();
                container.innerHTML += `<div id="${loadingId}" class="chat-message text-left mb-3"><span class="inline-block bg-gray-200 rounded-lg px-4 py-2"><div class="loading-spinner"></div> Mba Dika sedang mengetik... 💕</span></div>`;
                container.scrollTop = container.scrollHeight;
                
                try {
                    const answer = await answerQuestionWithYandere(state.selectedMatkul.nama, question);
                    
                    const loadingDiv = document.getElementById(loadingId);
                    if (loadingDiv) loadingDiv.remove();
                    
                    container.innerHTML += `<div class="chat-message text-left mb-3"><span class="inline-block dosen-speech p-3 rounded-lg max-w-[80%]">🧑‍🏫 ${escapeHtml(answer)}</span></div>`;
                    
                    state.chatHistory.push({ question, answer });
                    container.scrollTop = container.scrollHeight;
                } catch (error) {
                    const loadingDiv = document.getElementById(loadingId);
                    if (loadingDiv) loadingDiv.remove();
                    
                    container.innerHTML += `<div class="chat-message text-left mb-3"><span class="inline-block bg-red-100 text-red-600 rounded-lg px-4 py-2">⚠️ Error: ${error.message}</span></div>`;
                    container.scrollTop = container.scrollHeight;
                }
            };
            
            window.absenHariIni = () => {
                const now = new Date();
                const tanggal = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                const jam = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                
                const sudahAbsen = state.absensi.some(a => a.tanggal === tanggal);
                if (sudahAbsen) {
                    Swal.fire('Info', 'Kamu udah absen hari ini sayang, rajin banget sih! 🥰', 'info');
                    return;
                }
                
                state.absensi.push({ tanggal, jam, semester: state.semesterAktif });
                
                // Tambah achievement jika rajin
                if (state.absensi.length >= 10 && !state.achievements.includes('rajin')) {
                    state.achievements.push('rajin');
                    Swal.fire({
                        icon: 'success',
                        title: '🎉 Achievement Unlock! 🎉',
                        html: 'Kamu mendapat badge <strong>"Mahasiswa Rajin"</strong>! <br> Mba Dika bangga sama kamu! (｡♡‿♡｡)',
                        timer: 3000
                    });
                }
                
                saveState();
                
                Swal.fire({
                    icon: 'success',
                    title: 'Absen Berhasil! ✅',
                    html: `<div>📅 ${tanggal}<br>🕐 ${jam}</div><br>Mba Dika bangga sama kamu yang rajin!`,
                    timer: 2000,
                    showConfirmButton: false
                });
                
                if (state.currentPage === 'dashboard') {
                    render();
                }
            };
            
            window.changeSemester = async () => {
                const jurusanData = JURUSAN.find(j => j.id === state.jurusan?.id);
                const currentSemester = state.semesterAktif;
                
                if (currentSemester >= jurusanData.totalSemester) {
                    await Swal.fire({
                        icon: 'info',
                        title: 'Selamat! 🎓',
                        text: 'Kamu sudah mencapai semester akhir! Selamat ya sayang~ Mba Dika bangga!',
                        confirmButtonText: 'Terima kasih Mba Dika!'
                    });
                    return;
                }
                
                const semesterOptions = {};
                for (let i = 1; i <= jurusanData.totalSemester; i++) {
                    semesterOptions[i] = `Semester ${i}`;
                }
                
                const { value: newSemester } = await Swal.fire({
                    title: 'Ganti Semester',
                    text: `Saat ini kamu di Semester ${currentSemester}. Pilih semester baru:`,
                    input: 'select',
                    inputOptions: semesterOptions,
                    inputValue: currentSemester,
                    showCancelButton: true,
                    confirmButtonText: 'Ganti',
                    cancelButtonText: 'Batal'
                });
                
                if (newSemester && newSemester != currentSemester) {
                    state.semesterAktif = parseInt(newSemester);
                    saveState();
                    render();
                    await Swal.fire({
                        icon: 'success',
                        title: 'Semester Berubah! ✨',
                        html: `Selamat ya sayang, sekarang kamu di Semester ${state.semesterAktif}! <br> Jangan lupa belajar lebih giat lagi ya~ (๑•̀ㅂ•́)و✧`,
                        confirmButtonText: 'Siap Mba Dika!'
                    });
                }
            };
            
            window.logout = () => {
                Swal.fire({
                    title: 'Logout?',
                    text: 'Kamu yakin mau keluar sayang? Aku bakal kangen loh~ 😢',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'Ya, Logout',
                    cancelButtonText: 'Enggak Jadi'
                }).then(result => {
                    if (result.isConfirmed) {
                        localStorage.removeItem('pelajarin_state');
                        state = {
                            currentPage: 'landing',
                            user: null,
                            jurusan: null,
                            semesterAktif: 1,
                            ipk: 0,
                            totalSks: 0,
                            selectedMatkul: null,
                            materiCache: {},
                            chatHistory: [],
                            absensi: [],
                            nilaiPerMatkul: {},
                            progresBelajar: {},
                            quizScoreHistory: [],
                            forumDiskusi: [],
                            achievements: [],
                            notifications: []
                        };
                        render();
                        Swal.fire('Sampai Jumpa Lagi!', 'Mba Dika tunggu kamu kembali ya sayang~ ❤️', 'info');
                    }
                });
            };
            
            function escapeHtml(str) {
                if (!str) return '';
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }
            
            // Initialize
            loadState();
            render();
        })();
    </script>
</body>
</html>

        // Simpan ke localStorage
        function saveState() {

                ipk: state.ipk
            }));

        // Load dari localStorage
        function loadState() {
            const saved = localStorage.getItem('pelajarin_state');
            if (saved) {
                const data = JSON.parse(saved);
                state.user = data.user;
                state.jurusan = data.jurusan;
                state.semesterAktif = data.semesterAktif || 1;
                state.ipk = data.ipk || 0;
                if (state.user && state.jurusan) state.currentPage = 'dashboard';
            }
            render();
        }

        // API Call dengan loading & retry
        async function callAI(prompt, system = "Kamu adalah asisten akademik yang sangat berpengetahuan. Berikan jawaban yang detail, akurat, dan berbasis referensi ilmiah.") {
            const url = `${API_ENDPOINT}?prompt=${encodeURIComponent(prompt)}&system=${encodeURIComponent(system)}&temperature=0.7`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data.result || data.data || data.response || "Maaf, API tidak memberikan respons yang valid.";
            } catch (error) {
                console.error('API Error:', error);
                throw new Error(`Gagal terhubung ke AI: ${error.message}`);
            }
        }

        // Generate Materi dengan Referensi
        async function generateMateri(matkul, semester, jurusanNama) {
            const prompt = `Buat materi pembelajaran KULIAH yang DETAIL dan PROFESIONAL untuk:
- Mata Kuliah: ${matkul}
- Semester: ${semester}
- Jurusan: ${jurusanNama}

STRUKTUR MATERI (WAJIB):
1. Pendahuluan (latar belakang & pentingnya mata kuliah ini)
2. Konsep Dasar (definisi dan terminologi utama)
3. Pembahasan Utama (minimal 3 sub-bab)
4. Contoh Aplikasi/Kasus (minimal 2 contoh nyata)
5. Rangkuman
6. Daftar Pustaka (minimal 5 referensi dari GARUDA, ONESEARCH, NELITI)

FORMAT: HTML dengan heading (h2, h3), paragraf, bullet points, dan highlight penting.
Panjang: 800-1000 kata.
Bahasa: Indonesia formal akademik.
Sumber: WAJIB mencantumkan URL dari garuda.kemdikbud.go.id, onesearch.id, dan neliti.com`;

            return await callAI(prompt, "Anda adalah profesor ahli dengan pengalaman 20 tahun di bidangnya. Berikan materi yang komprehensif, update dengan perkembangan terbaru, dan berbasis penelitian.");
        }

        // Generate Quiz
        async function generateQuiz(matkul, semester, jurusanNama) {
            const prompt = `Buat 10 soal PILIHAN GANDA untuk mata kuliah "${matkul}" semester ${semester} jurusan ${jurusanNama}.

KETENTUAN:
- Setiap soal harus menguji pemahaman konsep, bukan hafalan
- Sertakan 1 soal analisis kasus
- Sertakan 1 soal perhitungan/simulasi (jika relevan)

FORMAT JSON:
[
  {
    "question": "teks soal",
    "options": ["pilihan A", "pilihan B", "pilihan C", "pilihan D"],
    "answer": 0,
    "explanation": "penjelasan singkat mengapa jawaban ini benar"
  }
]

Kirim HANYA JSON, tanpa teks lain.`;

            const response = await callAI(prompt, "Anda adalah ahli dalam membuat assessment berkualitas tinggi. Buat soal yang menantang namun adil.");
            const jsonMatch = response.match(/\[[\s\S]*\]/);
            if (jsonMatch) return JSON.parse(jsonMatch[0]);
            throw new Error("Format quiz tidak valid");
        }

        // Koreksi Essay
        async function koreksiEssay(soal, jawaban, rubrik) {
            const prompt = `Koreksi jawaban essay berikut:
SOAL: ${soal}
JAWABAN: ${jawaban}
RUBRIK: ${rubrik}

Beri nilai 0-100 dan feedback yang konstruktif. Format: JSON {"nilai": number, "feedback": "teks"}`;
            const response = await callAI(prompt);
            const jsonMatch = response.match(/\{[\s\S]*\}/);
            return jsonMatch ? JSON.parse(jsonMatch[0]) : { nilai: 70, feedback: response };
        }

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${matkulSemester.map((matkul, idx) => `
                                    <div class="border rounded-xl p-4 hover:shadow-md transition cursor-pointer group" onclick="openKelas('${matkul}', ${state.semesterAktif})">
                                        <div class="flex justify-between items-start">
                                            <div>
                                                <div class="text-sm text-purple-600 font-semibold">MK${String(idx+1).padStart(2,'0')}</div>
                                                <h3 class="font-bold group-hover:text-purple-600">${matkul}</h3>
                                                <div class="text-xs text-gray-500 mt-1"><i class="far fa-clock"></i> 3 SKS</div>
                                            </div>
                                            <i class="fas fa-chevron-right text-gray-400 group-hover:text-purple-600"></i>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Recent Activity -->
                        <div class="bg-white rounded-2xl shadow-sm p-6 mt-6">
                            <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fas fa-history text-purple-600"></i> Aktivitas Terakhir</h2>
                            <div id="recentActivities" class="space-y-2 text-gray-600 text-sm"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Kelas Page (Belajar)
        function KelasPage() {
            return `
                <div class="min-h-screen bg-gray-50">
                    <div class="gradient-primary text-white sticky top-0 z-50 shadow-lg">
                        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                            <button onclick="backToDashboard()" class="hover:opacity-80"><i class="fas fa-arrow-left"></i> Kembali</button>
                            <div class="font-semibold">${state.selectedMatkul?.nama || 'Mata Kuliah'}</div>
                            <div></div>
                        </div>
                    </div>

                    <div class="container mx-auto px-4 py-6">
                        <!-- Tab Navigation -->
                        <div class="flex border-b mb-6">
                            <button onclick="switchTab('materi')" id="tabMateriBtn" class="px-6 py-3 font-semibold border-b-2 border-purple-600 text-purple-600">📖 Materi</button>
                            <button onclick="switchTab('quiz')" id="tabQuizBtn" class="px-6 py-3 font-semibold text-gray-500 hover:text-gray-700">✏️ Quiz</button>
                            <button onclick="switchTab('chat')" id="tabChatBtn" class="px-6 py-3 font-semibold text-gray-500 hover:text-gray-700">💬 Chat AI</button>
                        </div>

                        <!-- Tab Content -->
                        <div id="materiTab" class="tab-content">
                            <div class="bg-white rounded-2xl shadow-sm p-6">
                                <div class="flex gap-3 mb-6">
                                    <button onclick="loadMateri()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700"><i class="fas fa-sync-alt"></i> Generate Materi</button>
                                    <button onclick="downloadMateriPDF()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600"><i class="fas fa-download"></i> Download PDF</button>
                                </div>
                                <div id="materiContent" class="prose max-w-none">
                                    <div class="text-center text-gray-500 py-12">
                                        <i class="fas fa-file-alt text-5xl mb-4 opacity-50"></i>
                                        <p>Klik "Generate Materi" untuk mulai belajar</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="quizTab" class="tab-content hidden">
                            <div class="bg-white rounded-2xl shadow-sm p-6">
                                <button onclick="startQuiz()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 mb-6"><i class="fas fa-play"></i> Mulai Quiz</button>
                                <div id="quizContent"></div>
                            </div>
                        </div>

                        <div id="chatTab" class="tab-content hidden">
                            <div class="bg-white rounded-2xl shadow-sm p-6">
                                <div id="chatMessages" class="h-96 overflow-y-auto mb-4 border rounded-lg p-4 bg-gray-50"></div>
                                <div class="flex gap-2">
                                    <input type="text" id="chatInput" placeholder="Tanyakan tentang materi..." class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:border-purple-600">
                                    <button onclick="sendChat()" class="bg-purple-600 text-white px-6 py-2 rounded-lg"><i class="fas fa-paper-plane"></i> Kirim</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Profile Modal
        function ProfileModal() {
            Swal.fire({
                title: 'Profile Mahasiswa',
                html: `
                    <div class="text-left">
                        <div class="mb-3"><label class="font-semibold">Nama Lengkap</label><input id="editNama" class="w-full border rounded-lg p-2 mt-1" value="${state.user?.nama || ''}"></div>
                        <div class="mb-3"><label class="font-semibold">Email</label><input id="editEmail" class="w-full border rounded-lg p-2 mt-1" value="${state.user?.email || ''}"></div>
                        <div class="mb-3"><label class="font-semibold">Jurusan</label><input class="w-full border rounded-lg p-2 mt-1 bg-gray-100" value="${state.jurusan?.nama || ''}" disabled></div>
                        <div class="mb-3"><label class="font-semibold">Semester Aktif</label><input id="editSemester" type="number" min="1" max="8" class="w-full border rounded-lg p-2 mt-1" value="${state.semesterAktif}"></div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Simpan',
                preConfirm: () => {
                    const nama = document.getElementById('editNama').value;
                    const email = document.getElementById('editEmail').value;
                    const semester = parseInt(document.getElementById('editSemester').value);
                    if (state.user) state.user.nama = nama;
                    if (state.user) state.user.email = email;
                    state.semesterAktif = Math.min(8, Math.max(1, semester));
                    saveState();
                    render();
                }
            });
        }

        // ==================== FUNGSI UTAMA ====================
        
        window.startRegistration = async () => {
            const { value: form } = await Swal.fire({
                title: 'Daftar Mahasiswa Baru',
                html: `
                    <input id="nama" class="swal2-input" placeholder="Nama Lengkap">
                    <input id="email" class="swal2-input" placeholder="Email">
                    <select id="jurusan" class="swal2-select">
                        <option value="">Pilih Jurusan</option>
                        ${JURUSAN.map(j => `<option value="${j.id}">${j.nama}</option>`).join('')}
                    </select>
                `,
                focusConfirm: false,
                preConfirm: () => {
                    return {
                        nama: document.getElementById('nama').value,
                        email: document.getElementById('email').value,
                        jurusanId: parseInt(document.getElementById('jurusan').value)
                    };
                }
            });
            
            if (form && form.nama && form.email && form.jurusanId) {
                state.user = { nama: form.nama, email: form.email };
                state.jurusan = JURUSAN.find(j => j.id === form.jurusanId);
                state.semesterAktif = 1;
                state.ipk = 0;
                saveState();
                state.currentPage = 'dashboard';
                render();
                Swal.fire('Berhasil!', 'Selamat datang di Pelajarin!', 'success');
            }
        };

        window.showJurusan = () => {
            const jurusanList = JURUSAN.map(j => `${j.nama}: ${j.deskripsi}`).join('\n\n');
            Swal.fire('Program Studi', jurusanList, 'info');
        };

        window.showJurusanDetail = (id) => {
            const jurusan = JURUSAN.find(j => j.id === id);
            Swal.fire({
                title: jurusan.nama,
                html: `
                    <div class="text-left">
                        <p class="mb-2">${jurusan.deskripsi}</p>
                        <p class="font-semibold mt-3">Prospek Karir:</p>
                        <p class="text-sm">${jurusan.prospek}</p>
                        <p class="font-semibold mt-3">Total Semester:</p>
                        <p>${jurusan.totalSemester} semester</p>
                        <p class="font-semibold mt-3">Mata Kuliah Unggulan:</p>
                        <ul class="list-disc list-inside text-sm">
                            ${MATA_KULIAH[id]?.[1]?.slice(0,4).map(mk => `<li>${mk}</li>`).join('') || ''}
                        </ul>
                    </div>
                `,
                confirmButtonText: 'Ambil Jurusan Ini',
                showCancelButton: true
            }).then(result => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: 'Daftar Sekarang',
                        html: `<input id="nama" class="swal2-input" placeholder="Nama Lengkap"><input id="email" class="swal2-input" placeholder="Email">`,
                        preConfirm: () => {
                            return { nama: document.getElementById('nama').value, email: document.getElementById('email').value };
                        }
                    }).then(res => {
                        if (res.value && res.value.nama) {
                            state.user = res.value;
                            state.jurusan = jurusan;
                            state.semesterAktif = 1;
                            state.ipk = 0;
                            saveState();
                            state.currentPage = 'dashboard';
                            render();
                        }
                    });
                }
            });
        };

        window.openKelas = (namaMatkul, semester) => {
            state.selectedMatkul = { nama: namaMatkul, semester: semester, jurusan: state.jurusan.nama };
            state.currentPage = 'kelas';
            render();
        };

        window.backToDashboard = () => {
            state.currentPage = 'dashboard';
            render();
        };

        window.loadMateri = async () => {
            const container = document.getElementById('materiContent');
            if (!container) return;
            
            container.innerHTML = '<div class="text-center py-12"><i class="fas fa-spinner fa-spin text-4xl text-purple-600"></i><p class="mt-2">Men-generate materi dengan referensi akademik...</p></div>';
            
            try {
                const materi = await generateMateri(state.selectedMatkul.nama, state.selectedMatkul.semester, state.selectedMatkul.jurusan);
                const materiKey = `${state.selectedMatkul.jurusan}_${state.selectedMatkul.semester}_${state.selectedMatkul.nama}`;
                state.materiCache[materiKey] = materi;
                container.innerHTML = `<div class="prose max-w-none">${materi}</div>`;
            } catch (error) {
                container.innerHTML = `<div class="text-center text-red-500 py-12"><i class="fas fa-exclamation-triangle text-4xl"></i><p>${error.message}</p></div>`;
            }
        };

        window.downloadMateriPDF = async () => {
            const materiContent = document.getElementById('materiContent');
            if (!materiContent || !materiContent.innerText.trim()) {
                Swal.fire('Info', 'Generate materi dulu ya!', 'info');
                return;
            }
            
            const element = document.createElement('div');
            element.innerHTML = materiContent.innerHTML;
            element.style.padding = '40px';
            element.style.fontFamily = 'Arial, sans-serif';
            document.body.appendChild(element);
            
            const canvas = await html2canvas(element, { scale: 2 });
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgWidth = 190;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
            pdf.save(`${state.selectedMatkul.nama}_Materi.pdf`);
            document.body.removeChild(element);
            Swal.fire('Sukses!', 'PDF berhasil diunduh', 'success');
        };

        window.startQuiz = async () => {
            Swal.fire({ title: 'Memuat Quiz...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            try {
                const quizKey = `${state.selectedMatkul.jurusan}_${state.selectedMatkul.semester}_${state.selectedMatkul.nama}`;
                let quiz = state.quizCache[quizKey];
                if (!quiz) {
                    quiz = await generateQuiz(state.selectedMatkul.nama, state.selectedMatkul.semester, state.selectedMatkul.jurusan);
                    state.quizCache[quizKey] = quiz;
                }
                showQuizQuestion(quiz, 0, []);
            } catch (error) {
                Swal.fire('Error', `Gagal memuat quiz: ${error.message}`, 'error');
            }
        };

        function showQuizQuestion(quiz, index, jawaban) {
            if (index >= quiz.length) {
                hitungNilaiQuiz(quiz, jawaban);
                return;
            }
            
            const q = quiz[index];
            const optionsHtml = q.options.map((opt, i) => `
                <label class="flex items-center p-3 border rounded-lg mb-2 cursor-pointer hover:bg-gray-50">
                    <input type="radio" name="answer" value="${i}" class="mr-3">
                    <span>${String.fromCharCode(65+i)}. ${opt}</span>
                </label>
            `).join('');
            
            Swal.fire({
                title: `Soal ${index+1}/${quiz.length}`,
                html: `<div class="text-left"><p class="font-bold mb-4">${q.question}</p>${optionsHtml}</div>`,
                showCancelButton: true,
                confirmButtonText: 'Jawab',
                preConfirm: () => {
                    const selected = document.querySelector('input[name="answer"]:checked');
                    if (!selected) return Swal.showValidationMessage('Pilih jawaban dulu!');
                    return parseInt(selected.value);
                }
            }).then(result => {
                if (result.isConfirmed) {
                    jawaban.push({ soal: q, jawabanUser: result.value });
                    showQuizQuestion(quiz, index+1, jawaban);
                }
            });
        }

        function hitungNilaiQuiz(quiz, jawaban) {
            let benar = 0;
            jawaban.forEach((j, idx) => {
                if (j.jawabanUser === j.soal.answer) benar++;
            });
            const nilai = (benar / quiz.length) * 100;
            
            Swal.fire({
                title: 'Hasil Quiz',
                html: `<div class="text-center"><div class="text-5xl font-bold ${nilai >= 70 ? 'text-green-600' : 'text-red-600'}">${Math.round(nilai)}</div><p class="mt-2">Benar: ${benar}/${quiz.length}</p><p class="text-sm text-gray-500 mt-3">${nilai >= 70 ? '🎉 Selamat! Pertahankan prestasimu!' : '📚 Terus belajar dan jangan menyerah!'}</p></div>`,
                icon: nilai >= 70 ? 'success' : 'info'
            });
            
            // Update IPK
            state.ipk = (state.ipk * 0.7 + (nilai/25) * 0.3);
            if (state.ipk > 4) state.ipk = 4;
            saveState();
        }

        window.sendChat = async () => {
            const input = document.getElementById('chatInput');
            const messagesDiv = document.getElementById('chatMessages');
            if (!input || !messagesDiv) return;
            
            const question = input.value.trim();
            if (!question) return;
            
            messagesDiv.innerHTML += `<div class="text-right mb-3"><span class="inline-block bg-purple-600 text-white rounded-lg px-4 py-2 max-w-[80%]">${escapeHtml(question)}</span></div>`;
            input.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            messagesDiv.innerHTML += `<div class="text-left mb-3"><span class="inline-block bg-gray-200 rounded-lg px-4 py-2"><i class="fas fa-spinner fa-spin"></i> AI sedang mengetik...</span></div>`;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            try {
                const prompt = `Sebagai dosen ahli untuk mata kuliah ${state.selectedMatkul.nama} (semester ${state.selectedMatkul.semester}, jurusan ${state.selectedMatkul.jurusan}), jawab pertanyaan mahasiswa dengan detail dan berikan referensi: ${question}`;
                const answer = await callAI(prompt);
                
                const lastMsg = messagesDiv.lastElementChild;
                if (lastMsg) lastMsg.remove();
                
                messagesDiv.innerHTML += `<div class="text-left mb-3"><span class="inline-block bg-gray-200 rounded-lg px-4 py-2 max-w-[80%]">${escapeHtml(answer)}</span></div>`;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                
                state.chatHistory.push({ question, answer });
            } catch (error) {
                const lastMsg = messagesDiv.lastElementChild;
                if (lastMsg) lastMsg.remove();
                messagesDiv.innerHTML += `<div class="text-left mb-3"><span class="inline-block bg-red-100 text-red-600 rounded-lg px-4 py-2">Error: ${error.message}</span></div>`;
            }
        };

        window.absenHariIni = async () => {
            const today = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const now = new Date().toLocaleTimeString('id-ID');
            
            Swal.fire({
                title: 'Absensi Berhasil!',
                html: `📅 ${today}<br>🕐 ${now}<br>✅ Status: Hadir`,
                icon: 'success',
                timer: 2000
            });
            
            // Simpan ke localStorage activity
            const activities = JSON.parse(localStorage.getItem('pelajarin_activities') || '[]');
            activities.unshift({ type: 'absen', date: today, time: now, matkul: 'Absensi Harian' });
            localStorage.setItem('pelajarin_activities', JSON.stringify(activities.slice(0, 10)));
            
            // Update recent activities di dashboard
            if (state.currentPage === 'dashboard') {
                updateRecentActivities();
            }
        };

        window.showProfile = () => ProfileModal();
        window.showTranskrip = () => {
            Swal.fire({
                title: 'Transkrip Nilai',
                html: `<div class="text-center"><div class="text-4xl font-bold text-purple-600">${state.ipk.toFixed(2)}</div><p>IPK Kumulatif</p><div class="border-t mt-4 pt-4"><p class="font-semibold">Semester Aktif: ${state.semesterAktif}</p><p>Total SKS: ${state.semesterAktif * 18}</p></div></div>`,
                icon: 'info'
            });
        };

        window.logout = () => {
            Swal.fire({
                title: 'Keluar?',
                text: 'Apakah Anda yakin ingin keluar?',
                icon: 'question',
                showCancelButton: true
            }).then(result => {
                if (result.isConfirmed) {
                    localStorage.removeItem('pelajarin_state');
                    state = { currentPage: 'landing', user: null, jurusan: null, semesterAktif: 1, ipk: 0, selectedMatkul: null, materiCache: {}, quizCache: {}, chatHistory: [] };
                    render();
                }
            });
        };

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(`${tab}Tab`).classList.remove('hidden');
            
            ['materi', 'quiz', 'chat'].forEach(t => {
                const btn = document.getElementById(`${t}Btn`);
                if (btn) {
                    btn.classList.remove('border-purple-600', 'text-purple-600');
                    btn.classList.add('text-gray-500');
                }
            });
            const activeBtn = document.getElementById(`${tab}Btn`);
            if (activeBtn) {
                activeBtn.classList.add('border-purple-600', 'text-purple-600');
                activeBtn.classList.remove('text-gray-500');
            }
        };

        function updateRecentActivities() {
            const container = document.getElementById('recentActivities');
            if (!container) return;
            const activities = JSON.parse(localStorage.getItem('pelajarin_activities') || '[]');
            if (activities.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400">Belum ada aktivitas</p>';
            } else {
                container.innerHTML = activities.map(act => `
                    <div class="flex justify-between items-center p-2 hover:bg-gray-50 rounded">
                        <span><i class="fas fa-calendar-check text-green-500 mr-2"></i> ${act.type === 'absen' ? 'Absensi' : 'Quiz'}</span>
                        <span class="text-xs">${act.date} ${act.time || ''}</span>
                    </div>
                `).join('');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Render utama
        function render() {
            const app = document.getElementById('app');
            if (state.currentPage === 'landing') {
                app.innerHTML = LandingPage();
            } else if (state.currentPage === 'dashboard') {
                app.innerHTML = DashboardPage();
                setTimeout(updateRecentActivities, 100);
            } else if (state.currentPage === 'kelas') {
                app.innerHTML = KelasPage();
                // Load chat history jika ada
                setTimeout(() => {
                    const messagesDiv = document.getElementById('chatMessages');
                    if (messagesDiv && state.chatHistory) {
                        messagesDiv.innerHTML = state.chatHistory.map(h => `
                            <div class="text-right mb-3"><span class="inline-block bg-purple-600 text-white rounded-lg px-4 py-2 max-w-[80%]">${escapeHtml(h.question)}</span></div>
                            <div class="text-left mb-3"><span class="inline-block bg-gray-200 rounded-lg px-4 py-2 max-w-[80%]">${escapeHtml(h.answer)}</span></div>
                        `).join('');
                    }
                }, 100);
            }
        }

        // Inisialisasi
        loadState();
    </script>
</body>
</html>

            function loadState() {
                const saved = localStorage.getItem('pelajarin_state');

            // API Call dengan error handling yang lebih baik
            async function callAPI(prompt, system = "Kamu adalah asisten akademik yang membantu mahasiswa.") {
                const url = `${API_ENDPOINT}?prompt=${encodeURIComponent(prompt)}&system=${encodeURIComponent(system)}&temperature=0.7`;
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    const data = await response.json();
                    
                    // Handle berbagai format respons
                    if (data.result) return String(data.result);
                    if (data.data) return String(data.data);
                    if (data.response) return String(data.response);
                    if (data.message) return String(data.message);
                    if (typeof data === 'string') return data;
                    
                    throw new Error("Format respons tidak dikenal");
                } catch (error) {
                    console.error('API Error:', error);
                    throw new Error(`Gagal terhubung ke AI: ${error.message}`);
                }
            }

<li>Sumber dari Neliti (2024)</li>
</ul>

                return await callAPI(prompt, "Anda adalah profesor ahli dengan pengalaman 20 tahun di bidang pendidikan tinggi.");
            }

            async function generateQuiz(matkul, semester, jurusanNama) {
                const prompt = `Buat 5 soal PILIHAN GANDA untuk mata kuliah "${matkul}" semester ${semester} jurusan ${jurusanNama}.

Format JSON valid (HANYA JSON, tanpa teks lain):
[
  {
    "question": "Soal 1: ...?",
    "options": ["Pilihan A", "Pilihan B", "Pilihan C", "Pilihan D"],
    "answer": 0
  },
  {
    "question": "Soal 2: ...?",
    "options": ["Pilihan A", "Pilihan B", "Pilihan C", "Pilihan D"],
    "answer": 1
  }
]

Pastikan JSON valid dan answer adalah index 0-3.`;

                const response = await callAPI(prompt, "Anda ahli membuat soal assessment pendidikan.");
                
                // Parse JSON dengan lebih aman
                let jsonStr = response;
                const match = response.match(/\[[\s\S]*\]/);
                if (match) jsonStr = match[0];
                
                try {
                    const parsed = JSON.parse(jsonStr);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        return parsed;
                    }
                    throw new Error("Format quiz tidak valid");
                } catch (e) {
                    throw new Error("Gagal memproses soal quiz: " + e.message);
                }
            }

Pertanyaan: ${question}

Berikan jawaban yang:
1. Lengkap dan informatif
2. Disertai contoh jika memungkinkan
3. Bahasa Indonesia formal akademik
4. Panjang sekitar 150-300 kata`;

                return await callAPI(prompt, "Anda adalah asisten dosen yang ramah dan berpengetahuan luas.");

                                    const progress = state.progresBelajar[mk] || 0;
                                    return `
                                        <div onclick="window.openKelas('${mk.replace(/'/g, "\\'")}', ${state.semesterAktif})" class="border rounded-xl p-3 hover:shadow-md cursor-pointer transition group">
                                            <div class="flex justify-between items-center">
                                                <div class="flex items-center gap-3">
                                                    <span class="w-8 h-8 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center font-semibold">${idx+1}</span>
                                                    <span class="font-medium group-hover:text-purple-600">${mk}</span>
                                                </div>
                                                <i class="fas fa-chevron-right text-gray-400 group-hover:text-purple-600"></i>
                                            </div>
                                            ${progress > 0 ? `<div class="mt-2"><div class="bg-gray-200 rounded-full h-1.5"><div class="bg-green-500 rounded-full h-1.5" style="width: ${progress}%"></div></div><div class="text-xs text-gray-500 mt-1">Progress: ${progress}%</div></div>` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                        
                        <!-- Absensi dan Informasi Lainnya -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="bg-white rounded-2xl shadow p-6">
                                <h2 class="text-xl font-bold mb-4"><i class="fas fa-history text-purple-600"></i> Riwayat Absensi</h2>
                                <div class="mb-3">
                                    <div class="flex justify-between text-sm mb-1">
                                        <span>Kehadiran Semester Ini</span>
                                        <span>${totalAbsensi} / ${targetAbsensi} (${persenAbsensi}%)</span>
                                    </div>
                                    <div class="bg-gray-200 rounded-full h-2">
                                        <div class="bg-green-500 rounded-full h-2" style="width: ${Math.min(persenAbsensi, 100)}%"></div>
                                    </div>
                                </div>
                                <div class="max-h-48 overflow-y-auto space-y-2 scrollbar-custom">
                                    ${state.absensi.length === 0 ? '<p class="text-gray-400 text-center py-4">Belum ada absensi. Klik tombol Absen di atas!</p>' : state.absensi.slice(-10).reverse().map(a => `
                                        <div class="flex justify-between items-center p-2 bg-gray-50 rounded">
                                            <span><i class="fas fa-calendar-day text-purple-500"></i> ${a.tanggal}</span>
                                            <span class="text-sm text-gray-500"><i class="fas fa-clock"></i> ${a.jam}</span>
                                            <span class="text-green-500 text-sm"><i class="fas fa-check-circle"></i> Hadir</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <div class="bg-white rounded-2xl shadow p-6">
                                <h2 class="text-xl font-bold mb-4"><i class="fas fa-chart-line text-purple-600"></i> Statistik Akademik</h2>
                                <div class="space-y-3">
                                    <div class="flex justify-between items-center p-2 border-b">
                                        <span>Rata-rata Nilai</span>
                                        <span class="font-bold text-purple-600">${(state.ipk * 25).toFixed(0)}</span>
                                    </div>
                                    <div class="flex justify-between items-center p-2 border-b">
                                        <span>Mata Kuliah Diambil</span>
                                        <span class="font-bold text-purple-600">${Object.keys(state.nilaiPerMatkul).length}</span>
                                    </div>
                                    <div class="flex justify-between items-center p-2 border-b">
                                        <span>Sertifikat Diperoleh</span>
                                        <span class="font-bold text-purple-600">0</span>
                                    </div>
                                    <div class="flex justify-between items-center p-2 border-b">
                                        <span>Peringkat Kelas</span>
                                        <span class="font-bold text-purple-600">-</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            function renderKelas() {
                return `
                    <div class="gradient-primary text-white sticky top-0 z-50 shadow-lg">
                        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                            <button onclick="window.backToDashboard()" class="hover:opacity-80 transition"><i class="fas fa-arrow-left"></i> Kembali</button>
                            <div class="font-semibold">${state.selectedMatkul?.nama || 'Mata Kuliah'}</div>
                            <div class="w-16"></div>
                        </div>
                    </div>
                    <div class="container mx-auto px-4 py-6">
                        <div class="flex border-b mb-6">
                            <button onclick="window.switchTab('materi')" id="btnMateri" class="px-6 py-3 font-semibold border-b-2 border-purple-600 text-purple-600 transition">📖 Materi</button>
                            <button onclick="window.switchTab('quiz')" id="btnQuiz" class="px-6 py-3 font-semibold text-gray-500 hover:text-purple-600 transition">✏️ Quiz</button>
                            <button onclick="window.switchTab('chat')" id="btnChat" class="px-6 py-3 font-semibold text-gray-500 hover:text-purple-600 transition">💬 Chat AI</button>
                        </div>
                        <div id="tabMateri" class="tab-content">
                            <div class="bg-white rounded-2xl shadow p-6">
                                <div class="flex flex-wrap gap-3 mb-6">
                                    <button onclick="window.loadMateri()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg transition"><i class="fas fa-sync-alt"></i> Generate Materi</button>
                                    <button onclick="window.downloadPDF()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition"><i class="fas fa-download"></i> Download PDF</button>
                                </div>
                                <div id="materiContent" class="prose max-w-none"><div class="text-center text-gray-400 py-12"><i class="fas fa-file-alt text-5xl mb-2 opacity-50"></i><p>Klik tombol Generate Materi untuk memulai</p></div></div>
                            </div>
                        </div>
                        <div id="tabQuiz" class="tab-content hidden">
                            <div class="bg-white rounded-2xl shadow p-6">
                                <button onclick="window.startQuiz()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition mb-6"><i class="fas fa-play"></i> Mulai Quiz</button>
                                <div id="quizContent"></div>
                            </div>
                        </div>
                        <div id="tabChat" class="tab-content hidden">
                            <div class="bg-white rounded-2xl shadow p-6">
                                <div id="chatMessages" class="h-96 overflow-y-auto mb-4 border rounded-lg p-4 bg-gray-50 scrollbar-custom"></div>
                                <div class="flex gap-2">
                                    <input type="text" id="chatInput" class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:border-purple-600 focus:ring-1 focus:ring-purple-600" placeholder="Tanyakan tentang materi ${state.selectedMatkul?.nama}..." onkeypress="if(event.key==='Enter') window.sendChat()">
                                    <button onclick="window.sendChat()" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-lg transition"><i class="fas fa-paper-plane"></i> Kirim</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Main Render Function
            function render() {
                const app = document.getElementById('app');
                if (!app) return;

                let html = '';
                if (state.currentPage === 'landing') {
                    html = renderLanding();
                } else if (state.currentPage === 'dashboard') {
                    html = renderDashboard();
                } else if (state.currentPage === 'kelas') {
                    html = renderKelas();
                }
                
                app.innerHTML = html;
                
                // Load chat history jika ada
                if (state.currentPage === 'kelas' && state.chatHistory && state.chatHistory.length > 0) {
                    setTimeout(() => {
                        const container = document.getElementById('chatMessages');
                        if (container) {
                            container.innerHTML = state.chatHistory.map(msg => `
                                <div class="chat-message text-right mb-3"><span class="inline-block bg-purple-600 text-white rounded-lg px-4 py-2 max-w-[80%]">${escapeHtml(msg.question)}</span></div>
                                <div class="chat-message text-left mb-3"><span class="inline-block bg-gray-200 rounded-lg px-4 py-2 max-w-[80%]">${escapeHtml(msg.answer)}</span></div>
                            `).join('');
                            container.scrollTop = container.scrollHeight;
                        }
                    }, 100);
                }
            }

            // Global Functions
            window.startRegistration = async () => {
                const { value: nama } = await Swal.fire({
                    title: 'Daftar Mahasiswa Baru',
                    text: 'Masukkan nama lengkap Anda',
                    input: 'text',
                    inputPlaceholder: 'Contoh: Ahmad Fauzi',
                    showCancelButton: true,
                    confirmButtonText: 'Lanjutkan',
                    cancelButtonText: 'Batal',
                    inputValidator: (value) => {
                        if (!value) return 'Nama tidak boleh kosong!';
                        if (value.length < 3) return 'Nama minimal 3 karakter!';
                    }
                });
                
                if (nama) {
                    const jurusanOptions = {};
                    JURUSAN.forEach(j => { jurusanOptions[j.id] = j.nama; });
                    
                    const { value: jurusanId } = await Swal.fire({
                        title: 'Pilih Program Studi',
                        text: 'Pilih jurusan yang sesuai dengan minat Anda',
                        input: 'select',
                        inputOptions: jurusanOptions,
                        showCancelButton: true,
                        confirmButtonText: 'Daftar Sekarang',
                        cancelButtonText: 'Batal'
                    });
                    
                    if (jurusanId) {
                        state.user = { nama: nama, terdaftar: new Date().toLocaleDateString('id-ID') };
                        state.jurusan = JURUSAN.find(j => j.id == jurusanId);
                        state.semesterAktif = 1;
                        state.ipk = 0;
                        state.totalSks = 0;
                        state.absensi = [];
                        state.nilaiPerMatkul = {};
                        state.progresBelajar = {};
                        saveState();
                        state.currentPage = 'dashboard';
                        render();
                        
                        await Swal.fire({
                            icon: 'success',
                            title: 'Selamat Datang!',
                            text: `Anda telah terdaftar sebagai mahasiswa ${state.jurusan.nama}`,
                            confirmButtonText: 'Mulai Belajar'
                        });
                    }
                }
            };

            window.selectJurusan = (id, nama) => {
                Swal.fire({
                    title: 'Ambil Jurusan Ini?',
                    html: `Apakah Anda yakin ingin mengambil jurusan <strong>${nama}</strong>?<br><br>Jurusan ini memiliki prospek karir yang cerah.`,
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'Ya, Daftar',
                    cancelButtonText: 'Batal'
                }).then(result => {
                    if (result.isConfirmed) {
                        startRegistration();
                    }
                });
            };

            window.openKelas = (namaMatkul, semester) => {
                state.selectedMatkul = { nama: namaMatkul, semester: semester, jurusan: state.jurusan.nama };
                state.chatHistory = []; // Reset chat history untuk matkul baru
                state.currentPage = 'kelas';
                render();
            };

            window.backToDashboard = () => {
                state.currentPage = 'dashboard';
                render();
            };

            window.switchTab = (tab) => {
                const materiTab = document.getElementById('tabMateri');
                const quizTab = document.getElementById('tabQuiz');
                const chatTab = document.getElementById('tabChat');
                const btnMateri = document.getElementById('btnMateri');
                const btnQuiz = document.getElementById('btnQuiz');
                const btnChat = document.getElementById('btnChat');
                
                if (!materiTab || !quizTab || !chatTab) return;
                
                materiTab.classList.add('hidden');
                quizTab.classList.add('hidden');
                chatTab.classList.add('hidden');
                
                if (tab === 'materi') {
                    materiTab.classList.remove('hidden');
                    btnMateri.classList.add('border-purple-600', 'text-purple-600');
                    btnMateri.classList.remove('text-gray-500');
                    btnQuiz.classList.remove('border-purple-600', 'text-purple-600');
                    btnQuiz.classList.add('text-gray-500');
                    btnChat.classList.remove('border-purple-600', 'text-purple-600');
                    btnChat.classList.add('text-gray-500');
                } else if (tab === 'quiz') {
                    quizTab.classList.remove('hidden');
                    btnQuiz.classList.add('border-purple-600', 'text-purple-600');
                    btnQuiz.classList.remove('text-gray-500');
                    btnMateri.classList.remove('border-purple-600', 'text-purple-600');
                    btnMateri.classList.add('text-gray-500');
                    btnChat.classList.remove('border-purple-600', 'text-purple-600');
                    btnChat.classList.add('text-gray-500');
                } else if (tab === 'chat') {
                    chatTab.classList.remove('hidden');
                    btnChat.classList.add('border-purple-600', 'text-purple-600');
                    btnChat.classList.remove('text-gray-500');
                    btnMateri.classList.remove('border-purple-600', 'text-purple-600');
                    btnMateri.classList.add('text-gray-500');
                    btnQuiz.classList.remove('border-purple-600', 'text-purple-600');
                    btnQuiz.classList.add('text-gray-500');
                }
            };

            window.loadMateri = async () => {
                const container = document.getElementById('materiContent');
                if (!container) return;
                
                container.innerHTML = '<div class="text-center py-12"><div class="loading-spinner"></div><p class="mt-2 text-gray-600">AI sedang menyusun materi...</p><p class="text-sm text-gray-400 mt-1">Mohon tunggu sebentar</p></div>';
                
                try {
                    const materi = await generateMateri(state.selectedMatkul.nama, state.selectedMatkul.semester, state.selectedMatkul.jurusan);
                    container.innerHTML = `<div class="prose max-w-none">${materi}</div>`;
                    
                    // Update progress
                    const currentProgress = state.progresBelajar[state.selectedMatkul.nama] || 0;
                    state.progresBelajar[state.selectedMatkul.nama] = Math.min(currentProgress + 20, 100);
                    saveState();
                    
                    await Swal.fire({
                        icon: 'success',
                        title: 'Materi Siap!',
                        text: 'Materi telah berhasil di-generate',
                        timer: 1500,
                        showConfirmButton: false
                    });
                } catch (error) {
                    container.innerHTML = `<div class="text-center text-red-500 py-12"><i class="fas fa-exclamation-triangle text-4xl mb-2"></i><p>Error: ${error.message}</p><p class="text-sm mt-2">Silakan coba lagi</p></div>`;
                }
            };

            window.downloadPDF = async () => {
                const container = document.getElementById('materiContent');
                if (!container || !container.innerText.trim() || container.innerText.includes('Klik tombol Generate')) {
                    await Swal.fire('Info', 'Generate materi terlebih dahulu sebelum mendownload PDF!', 'info');
                    return;
                }
                
                Swal.fire({
                    title: 'Membuat PDF...',
                    text: 'Mohon tunggu sebentar',
                    allowOutsideClick: false,
                    didOpen: () => Swal.showLoading()
                });
                
                try {
                    const element = container.cloneNode(true);
                    element.style.padding = '40px';
                    element.style.backgroundColor = 'white';
                    element.style.fontFamily = 'Arial, sans-serif';
                    document.body.appendChild(element);
                    
                    const canvas = await html2canvas(element, { 
                        scale: 2,
                        logging: false,
                        useCORS: true
                    });
                    
                    const imgData = canvas.toDataURL('image/png');
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const imgWidth = 190;
                    const imgHeight = (canvas.height * imgWidth) / canvas.width;
                    
                    pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
                    pdf.save(`${state.selectedMatkul.nama.replace(/[^a-z0-9]/gi, '_')}_Materi.pdf`);
                    
                    document.body.removeChild(element);
                    
                    await Swal.fire('Sukses!', 'PDF berhasil diunduh', 'success');
                } catch (error) {
                    await Swal.fire('Error', `Gagal membuat PDF: ${error.message}`, 'error');
                }
            };

            window.startQuiz = async () => {
                Swal.fire({
                    title: 'Memuat Quiz...',
                    text: 'AI sedang menyusun soal untuk Anda',
                    allowOutsideClick: false,
                    didOpen: () => Swal.showLoading()
                });
                
                try {
                    const quiz = await generateQuiz(state.selectedMatkul.nama, state.selectedMatkul.semester, state.selectedMatkul.jurusan);
                    showQuizQuestion(quiz, 0, []);
                } catch (error) {
                    await Swal.fire('Error', `Gagal memuat quiz: ${error.message}`, 'error');
                }
            };

            function showQuizQuestion(quiz, index, jawaban) {
                if (index >= quiz.length) {
                    let benar = jawaban.filter((j, i) => j === quiz[i].answer).length;
                    let nilai = (benar / quiz.length) * 100;
                    state.ipk = (state.ipk * 0.9 + (nilai / 25) * 0.1);
                    if (state.ipk > 4) state.ipk = 4;
                    
                    // Update nilai per matkul
                    if (!state.nilaiPerMatkul[state.selectedMatkul.nama]) {
                        state.nilaiPerMatkul[state.selectedMatkul.nama] = [];
                    }
                    state.nilaiPerMatkul[state.selectedMatkul.nama].push(nilai);
                    saveState();
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'Quiz Selesai!',
                        html: `
                            <div class="text-left">
                                <p><strong>Nilai:</strong> ${Math.round(nilai)}</p>
                                <p><strong>Benar:</strong> ${benar} / ${quiz.length}</p>
                                <p><strong>IPK:</strong> ${state.ipk.toFixed(2)}</p>
                            </div>
                        `,
                        confirmButtonText: 'OK'
                    });
                    return;
                }
                
                const q = quiz[index];
                Swal.fire({
                    title: `Soal ${index+1} dari ${quiz.length}`,
                    html: `
                        <div class="text-left">
                            <p class="font-bold mb-4 text-lg">${escapeHtml(q.question)}</p>
                            ${q.options.map((opt, i) => `
                                <label class="flex items-center p-3 border rounded-lg mb-2 cursor-pointer hover:bg-gray-50 transition">
                                    <input type="radio" name="answer" value="${i}" class="mr-3 w-4 h-4">
                                    <span class="font-semibold mr-2">${String.fromCharCode(65+i)}.</span> ${escapeHtml(opt)}
                                </label>
                            `).join('')}
                        </div>
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Jawab',
                    cancelButtonText: 'Batal',
                    preConfirm: () => {
                        const selected = document.querySelector('input[name="answer"]:checked');
                        if (!selected) {
                            Swal.showValidationMessage('Pilih salah satu jawaban terlebih dahulu!');
                            return false;
                        }
                        return parseInt(selected.value);
                    }
                }).then(result => {
                    if (result.isConfirmed) {
                        jawaban.push(result.value);
                        showQuizQuestion(quiz, index + 1, jawaban);
                    }
                });
            }

            window.sendChat = async () => {
                const input = document.getElementById('chatInput');
                const container = document.getElementById('chatMessages');
                if (!input || !container) return;
                
                const question = input.value.trim();
                if (!question) return;
                
                // Add user message
                container.innerHTML += `<div class="chat-message text-right mb-3"><span class="inline-block bg-purple-600 text-white rounded-lg px-4 py-2 max-w-[80%]">${escapeHtml(question)}</span></div>`;
                input.value = '';
                container.scrollTop = container.scrollHeight;
                
                // Add loading indicator
                const loadingId = 'loading_' + Date.now();
                container.innerHTML += `<div id="${loadingId}" class="chat-message text-left mb-3"><span class="inline-block bg-gray-200 rounded-lg px-4 py-2"><div class="loading-spinner"></div> AI sedang mengetik...</span></div>`;
                container.scrollTop = container.scrollHeight;
                
                try {
                    const answer = await answerQuestion(state.selectedMatkul.nama, question);
                    
                    // Remove loading indicator
                    const loadingDiv = document.getElementById(loadingId);
                    if (loadingDiv) loadingDiv.remove();
                    
                    // Add AI response
                    container.innerHTML += `<div class="chat-message text-left mb-3"><span class="inline-block bg-gray-200 rounded-lg px-4 py-2 max-w-[80%]">${escapeHtml(answer)}</span></div>`;
                    
                    // Save to history
                    state.chatHistory.push({ question, answer });
                    container.scrollTop = container.scrollHeight;
                } catch (error) {
                    const loadingDiv = document.getElementById(loadingId);
                    if (loadingDiv) loadingDiv.remove();
                    
                    container.innerHTML += `<div class="chat-message text-left mb-3"><span class="inline-block bg-red-100 text-red-600 rounded-lg px-4 py-2">⚠️ Error: ${error.message}</span></div>`;
                    container.scrollTop = container.scrollHeight;
                }
            };

            window.absenHariIni = () => {
                const now = new Date();
                const tanggal = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                const jam = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                
                // Cek apakah sudah absen hari ini
                const sudahAbsen = state.absensi.some(a => a.tanggal === tanggal);
                if (sudahAbsen) {
                    Swal.fire('Info', 'Anda sudah melakukan absen hari ini!', 'info');
                    return;
                }
                
                state.absensi.push({ tanggal, jam, semester: state.semesterAktif });
                saveState();
                
                Swal.fire({
                    icon: 'success',
                    title: 'Absen Berhasil!',
                    html: `<div>✅ ${tanggal}<br>🕐 ${jam}</div>`,
                    timer: 2000,
                    showConfirmButton: false
                });
                
                if (state.currentPage === 'dashboard') {
                    render();
                }
            };

            window.changeSemester = async () => {
                const jurusanData = JURUSAN.find(j => j.id === state.jurusan?.id);
                const currentSemester = state.semesterAktif;
                
                if (currentSemester >= jurusanData.totalSemester) {
                    await Swal.fire('Informasi', 'Anda sudah mencapai semester akhir!', 'info');
                    return;
                }
                
                const { value: newSemester } = await Swal.fire({
                    title: 'Ganti Semester',
                    text: `Saat ini Anda di Semester ${currentSemester}. Pilih semester baru:`,
                    input: 'select',
                    inputOptions: {
                        1: 'Semester 1',
                        2: 'Semester 2',
                        3: 'Semester 3',
                        4: 'Semester 4',
                        5: 'Semester 5',
                        6: 'Semester 6',
                        7: 'Semester 7',
                        8: 'Semester 8'
                    },
                    inputValue: currentSemester,
                    showCancelButton: true,
                    confirmButtonText: 'Ganti',
                    cancelButtonText: 'Batal'
                });
                
                if (newSemester) {
                    state.semesterAktif = parseInt(newSemester);
                    saveState();
                    render();
                    await Swal.fire('Berhasil!', `Semester berhasil diganti ke Semester ${state.semesterAktif}`, 'success');
                }
            };

            window.logout = () => {
                Swal.fire({
                    title: 'Keluar?',
                    text: 'Anda akan keluar dari akun. Data tetap tersimpan.',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'Ya, Keluar',
                    cancelButtonText: 'Batal'
                }).then(result => {
                    if (result.isConfirmed) {
                        localStorage.removeItem('pelajarin_state');
                        state = {
                            currentPage: 'landing',
                            user: null,
                            jurusan: null,
                            semesterAktif: 1,
                            ipk: 0,
                            totalSks: 0,
                            selectedMatkul: null,
                            materiCache: {},
                            quizCache: {},
                            chatHistory: [],
                            absensi: [],
                            nilaiPerMatkul: {},
                            progresBelajar: {},
                            forumDiskusi: []
                        };
                        render();
                    }
                });
            };

            function escapeHtml(str) {
                if (!str) return '';
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            // Initialize
            loadState();
            render();
        })();
    </script>
</body>
</html>
